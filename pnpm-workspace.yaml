packages:
  - apps/*
  - packages/*
  - packages/messaging/*
  - packages/messaging/providers/*
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Library-owner-approved upgrade inside the seven-day maturity window.
  - '@shutterstock/p-map-iterable@1.2.0'
  # Slack's 27 Aug 2026 Agent Sessions types are required for this integration.
  - '@slack/types@3.1.0'
  - '@slack/web-api@8.1.0'
  # First-party protocol pin; keep this exact exception aligned with desktop.
  - '@pwrdrvr/codex-app-server-protocol@0.159.2'
  - '@modelcontextprotocol/sdk@1.30.0'
  # Security fix; published inside the normal seven-day maturity window.
  - 'qs@6.16.0'
  # Electron 44.4.5 (23 Sep 2026) carries upstream Chromium, V8, ANGLE, Dawn,
  # and PDFium security backports; 41.x stopped receiving them on 25 Aug 2026.
  - 'electron@44.4.5'
  - '@pwrdrvr/agent-core'
  - '@pwrdrvr/agent-transport'
  - '@pwrdrvr/codex-discovery'
  - '@pwrdrvr/agent-acp'
  - '@pwrdrvr/agent-client'
  - '@babel/core@7.29.6'
  - '@esbuild/aix-ppc64@0.28.1'
  - '@esbuild/android-arm64@0.28.1'
  - '@esbuild/android-arm@0.28.1'
  - '@esbuild/android-x64@0.28.1'
  - '@esbuild/darwin-arm64@0.28.1'
  - '@esbuild/darwin-x64@0.28.1'
  - '@esbuild/freebsd-arm64@0.28.1'
  - '@esbuild/freebsd-x64@0.28.1'
  - '@esbuild/linux-arm64@0.28.1'
  - '@esbuild/linux-arm@0.28.1'
  - '@esbuild/linux-ia32@0.28.1'
  - '@esbuild/linux-loong64@0.28.1'
  - '@esbuild/linux-mips64el@0.28.1'
  - '@esbuild/linux-ppc64@0.28.1'
  - '@esbuild/linux-riscv64@0.28.1'
  - '@esbuild/linux-s390x@0.28.1'
  - '@esbuild/linux-x64@0.28.1'
  - '@esbuild/netbsd-arm64@0.28.1'
  - '@esbuild/netbsd-x64@0.28.1'
  - '@esbuild/openbsd-arm64@0.28.1'
  - '@esbuild/openbsd-x64@0.28.1'
  - '@esbuild/openharmony-arm64@0.28.1'
  - '@esbuild/sunos-x64@0.28.1'
  - '@esbuild/win32-arm64@0.28.1'
  - '@esbuild/win32-ia32@0.28.1'
  - '@esbuild/win32-x64@0.28.1'
  - esbuild@0.28.1
  - form-data@4.0.6
  - protobufjs@7.6.5
  - tmp@0.2.7
  - ws@8.21.0
# Ignore user-level pnpmfiles so the project git policy and lockfile checksum
# are identical for contributors and CI.
globalPnpmfile: null
ignoreScripts: false
allowBuilds:
  # better-sqlite3 13 and node-pty ship Node-API prebuilds that load in Node
  # and Electron alike. pnpm otherwise infers `node-gyp rebuild` from
  # better-sqlite3's binding.gyp although the package declares
  # `gypfile: false`, and node-pty's install script only falls back to
  # node-gyp. Packaging stages the target's prebuilds in beforePack.
  better-sqlite3: false
  electron-winstaller: false
  node-pty: false
  protobufjs: false
  dugite: true
  electron: true
  esbuild: true

overrides:
  "@babel/core": "7.29.6"
  "@hono/node-server": "2.0.10"
  "@types/node": "^24.12.4"
