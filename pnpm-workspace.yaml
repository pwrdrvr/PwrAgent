packages:
  - apps/*
  - packages/*
  - packages/messaging/*
  - packages/messaging/providers/*
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@pwrdrvr/codex-app-server-protocol@0.133.0'
  - '@pwrdrvr/agent-core'
  - '@pwrdrvr/agent-transport'
  - '@pwrdrvr/codex-discovery'
  - '@pwrdrvr/agent-acp'
  - '@pwrdrvr/agent-client'
  - tmp@0.2.6
globalPnpmfile: ''
ignoreScripts: false
ignoredBuiltDependencies:
  - electron-winstaller
  - protobufjs
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
