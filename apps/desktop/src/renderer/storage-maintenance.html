<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PwrAgent storage</title>
    <script>
      // Mirrors the appearance bootstrap in index.html: data-theme is the
      // scheme (light, or absent for dark), data-color-theme recolors the
      // tokens on top of it, and data-platform selects the title strip.
      (function () {
        const bridged = window.storageMaintenance ?? {};
        const root = document.documentElement;
        if (bridged.platform) root.dataset.platform = bridged.platform;
        const selectedTheme = bridged.theme ?? "system";
        const scheme = selectedTheme === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : selectedTheme;
        if (scheme === "light") root.dataset.theme = "light";
        const colorTheme = scheme === "light" ? bridged.lightTheme : bridged.darkTheme;
        if (colorTheme && colorTheme !== "tangerine-dark" && colorTheme !== "tangerine-light") {
          root.dataset.colorTheme = colorTheme;
        }
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/features/storage-maintenance/StorageMaintenance.tsx"></script></body>
</html>
