<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <!--
      Fallback only. The main process owns every window's OS title:
      shell windows via `lockMainWindowTitle` (main-window-title.ts),
      auxiliary windows via `registerAuxiliaryWindowTitle`, both of
      which preventDefault the page-title mirror. This tag exists so a
      titleless document can't make Electron fall back to the renderer
      URL, and so the dev-server browser tab reads sensibly. Keep it in
      sync with `APP_WINDOW_TITLE` — an earlier copy sat at the
      pre-rename "PwrAgnt" and won over the main-process title on load.
    -->
    <title>PwrAgent</title>
    <script>
      // Appearance bootstrap — runs BEFORE the React bundle loads so the
      // first paint matches the persisted theme + density. Without this,
      // a flash-of-wrong-theme appears on every launch (renders dark for
      // ~50-150ms, then snaps to light when React mounts the setting).
      //
      // Reads `window.__pwragentAppearance`, exposed synchronously by the
      // preload script (which decodes it from `process.argv`'s
      // `--pwragent-appearance=...` flag set by main at window-creation).
      // Main reads the active profile's config.toml `[general.appearance]`
      // block — the TOML is the single source of truth. The renderer's
      // useAppearance hook writes back via writeSettingsConfig IPC when
      // the user changes the toggle, and the next launch reads the new
      // value through the same path.
      //
      // For theme: "system", resolves the active scheme via matchMedia
      // at this exact instant. If the user's OS theme changes mid-session,
      // the renderer hook listens for that and updates the attribute live
      // — no reload needed.
      (function () {
        try {
          // Tag the OS platform so platform-specific window chrome (e.g. the
          // Windows title bar / caption-button reservation) applies on first
          // paint. Exposed synchronously by the preload as __pwragentPlatform.
          var platform = window.__pwragentPlatform;
          if (platform) {
            document.documentElement.setAttribute("data-platform", platform);
          }
          var bridged = window.__pwragentAppearance || {};
          var theme = bridged.theme || "system";
          var density = bridged.density || "mission-control";
          var resolvedTheme;
          if (theme === "light" || theme === "dark") {
            resolvedTheme = theme;
          } else {
            // "system" or unset — resolve via prefers-color-scheme.
            resolvedTheme = window.matchMedia
              && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          // Only set data-theme when the resolved theme is light. Dark is
          // the default the bare :root carries, so omitting the attribute
          // keeps the CSS cascade simple.
          if (resolvedTheme === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
          // Mission-control is also the default; only set the attribute
          // when compact is selected.
          if (density === "compact") {
            document.documentElement.setAttribute("data-density", "compact");
          }
          // Text-size axes: "md" is the default the bare :root carries;
          // any other bridged value sets the attribute. No notch allowlist
          // here on purpose — this inline script cannot import the shared
          // enum, an unknown value is inert in CSS (no notch selector
          // matches, the :root default holds), and a stale hand-copied
          // list would downgrade future notches to md at first paint.
          // One applier serves every axis so the contract lives once.
          function applyTextSize(value, attribute) {
            if (typeof value === "string" && value !== "md") {
              document.documentElement.setAttribute(attribute, value);
            }
          }
          applyTextSize(bridged.sidebarTextSize, "data-sidebar-text");
          applyTextSize(bridged.transcriptTextSize, "data-transcript-text");
        } catch (_) {
          // Bridge unavailable or shape wrong — fall back to dark + mission-
          // control defaults. The useAppearance hook will resync once the
          // settings snapshot arrives over IPC.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
