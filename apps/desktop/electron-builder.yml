appId: com.pwrdrvr.pwragent
productName: PwrAgent
copyright: "Copyright © 2026 PwrDrvr LLC."

# Dock tile plug-ins are nested code. Sign the staged bundle before
# electron-builder seals the parent PwrAgent.app for notarization.
afterPack: "scripts/afterpack-sign-dock-tile-plugin.mjs"

# Pinned so `pnpm deploy --prod` works — electron lives in devDependencies
# and is therefore not present in the deploy stage's node_modules.
# Keep this in sync with the apps/desktop Electron version resolved in
# pnpm-lock.yaml. CI enforces the exact packaged/runtime match.
electronVersion: 41.10.6

# Bundle layout
asar: true
asarUnpack:
  - "**/*.node"
  # @napi-rs/canvas loads its ICU data beside the Windows native binding.
  - "node_modules/@napi-rs/canvas-win32-x64-msvc/**/*"
compression: normal

# Files included in the .app bundle. Run via apps/desktop/scripts/release.mjs
# which first runs `pnpm deploy` to materialize a flat node_modules tree, since
# pnpm's symlinked virtual store interacts poorly with electron-builder's
# default node_modules walk.
files:
  - "out/**/*"
  - "package.json"
  # Compiled JS only — drop sources, declarations, and sourcemaps.
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.d.ts"
  - "!**/tsconfig*.json"
  # Tests of any flavor.
  - "!**/*.test.*"
  - "!**/*.spec.*"
  - "!**/__tests__/**"
  - "!**/__mocks__/**"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/e2e/**"
  - "!**/playwright.config.*"
  # Markdown / docs from third-party packages and our own workspace packages.
  # (Workspace packages are inlined by vite/electron-vite into out/; the copies
  # in node_modules are dead weight.) Runtime markdown such as the review
  # prompt is imported via Vite's ?raw and inlined into the compiled JS.
  - "!**/*.md"
  - "!**/*.mdx"
  - "!**/docs/**"
  # Misc dotfiles and examples that occasionally ship inside dependency tarballs.
  - "!**/.env*"
  - "!**/.npmignore"
  - "!**/.editorconfig"
  - "!**/.eslintrc*"
  - "!**/.prettierrc*"
  - "!**/.github/**"
  # Dev-only Electron native prebuilds are single-arch. electron-builder
  # rebuilds build/Release for each target arch before creating the universal
  # app, so including electron-native would break universal merge.
  - "!**/electron-native/**"
  # node-pty ships every platform's native prebuild in its package tarball.
  # Keep those out of app.asar.unpacked so macOS universal merging only sees
  # electron-builder's rebuilt current-arch binary under build/Release.
  - "!**/node_modules/node-pty/prebuilds/**"
  # Our own workspace package metadata is unused at runtime — vite inlines.
  - "!**/node_modules/@pwragent/*/AGENTS.md"
  - "!**/node_modules/@pwragent/*/src/**"

extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_LICENSES
    to: THIRD_PARTY_LICENSES
  - from: CHANGELOG.md
    to: CHANGELOG.md
  - from: build/icon.png
    to: pwragent-app-icon.png
  - from: src/renderer/src/assets/pwrsnap/pwrsnap-app-icon.png
    to: pwrsnap-app-icon.png
  - from: build/bundled-agents
    to: agents
  - from: build/bundled-tools/ripgrep
    to: tools

# Electron fuses — ASAR integrity is NOT on by default in electron-builder.
# Enable it explicitly so the runtime aborts if the .asar is tampered with.
electronFuses:
  # Packaged Node helpers use the Electron binary with ELECTRON_RUN_AS_NODE.
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: true

mac:
  # Both prebuilt canvas bindings are intentionally present in both temporary
  # per-arch apps. They have distinct package paths and runtime selects the
  # matching one, so keep the identical single-arch files side-by-side when
  # electron-builder merges the universal app.
  x64ArchFiles: "Contents/Resources/app.asar.unpacked/node_modules/@napi-rs/canvas-darwin-*/**"
  category: public.app-category.developer-tools
  # Icon Composer package, NOT a hand-built .icns: electron-builder compiles
  # it with Xcode 26's actool (Assets.car + CFBundleIconName for macOS 26) and
  # derives the legacy icon.icns + CFBundleIconFile (macOS 15 and earlier).
  # Needs actool 26 selected (release.yml and preview-build.yml do it). Why:
  # AGENTS.md "macOS app icon".
  icon: build/icon.icon
  hardenedRuntime: true
  gatekeeperAssess: false
  # mac.notarize: true reads APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER
  # (preferred for CI) or APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID
  # (acceptable locally) from the environment. Do NOT commit these.
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Helper bundle renames — verify post-build with Activity Monitor that all
  # four child processes carry the PwrAgent brand, not "Electron Helper".
  # Note: the field is helperGPUBundleId (capital GPU) per electron-builder
  # source; lowercase 'gpu' silently no-ops.
  helperBundleId: com.pwrdrvr.pwragent.helper
  helperRendererBundleId: com.pwrdrvr.pwragent.helper.Renderer
  helperGPUBundleId: com.pwrdrvr.pwragent.helper.GPU
  helperPluginBundleId: com.pwrdrvr.pwragent.helper.Plugin
  extraFiles:
    - from: build/native/PwrAgentDockTilePlugin.plugin
      to: PlugIns/PwrAgentDockTilePlugin.plugin
  extendInfo:
    NSHumanReadableCopyright: "Copyright © 2026 PwrDrvr LLC."
    NSUserNotificationAlertStyle: alert
    LSMinimumSystemVersion: "12.0"
    LSApplicationCategoryType: public.app-category.developer-tools
    NSDockTilePlugIn: PwrAgentDockTilePlugin.plugin
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]

linux:
  icon: build/icon.png
  executableName: pwragent
  category: Development
  maintainer: PwrDrvr LLC
  synopsis: Thread-centric coding agent desktop app
  description: PwrAgent is a thread-centric coding agent desktop app for local development workflows.
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"
  target:
    - target: deb
      arch: [x64, arm64]
  desktop:
    entry:
      Name: PwrAgent
      Comment: Thread-centric coding agent desktop app
      StartupWMClass: PwrAgent

deb:
  priority: optional

win:
  icon: build/icon.png
  # Windows .ico is generated from the 512x512 build/icon.png by electron-builder.
  artifactName: "${productName}-${version}-windows-${arch}.${ext}"
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: PwrAgent
  # Without this, electron-builder defaults uninstallDisplayName to
  # "${productName} ${version}", so Add or Remove Programs shows
  # "PwrAgent 1.2.3" next to a Version column that already says 1.2.3.
  # Safe to change: the installer rewrites DisplayName on every install
  # and the upgrade path uninstalls the prior version first, so existing
  # installs self-heal. Upgrade and uninstall detection are unaffected --
  # both registry keys are derived from appId, not from this string.
  uninstallDisplayName: PwrAgent
  artifactName: "${productName}-${version}-windows-${arch}-setup.${ext}"

dmg:
  background: build/dmg-background.png
  window:
    width: 660
    height: 400
  iconSize: 112
  iconTextSize: 12
  contents:
    - x: 170
      y: 230
      type: file
    - x: 500
      y: 230
      type: link
      path: /Applications
  writeUpdateInfo: false

# GitHub Releases are the canonical desktop artifact channel. macOS update
# metadata is still produced by electron-builder; Linux .deb packages are
# uploaded by the release workflow after native packaging and checksum creation.
publish:
  provider: github
  owner: pwrdrvr
  repo: PwrAgent
  private: false
  releaseType: release
