# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "PwrAgent"

[setup]
script = '''
nvm install
corepack enable
pnpm install
'''

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"
$nodeVersion = (Get-Content -LiteralPath .nvmrc -Raw).Trim().TrimStart('v')
nvm install $nodeVersion
if ($LASTEXITCODE -ne 0) { throw "nvm install failed" }
nvm use $nodeVersion
if ($LASTEXITCODE -ne 0) { throw "nvm use failed" }
corepack.cmd enable
if ($LASTEXITCODE -ne 0) { throw "corepack enable failed" }
pnpm.cmd install
if ($LASTEXITCODE -ne 0) { throw "pnpm install failed" }
'''

[cleanup]
script = "rm -rf node_modules"

[cleanup.win32]
script = '''
if (Test-Path -LiteralPath node_modules) {
  Remove-Item -LiteralPath node_modules -Recurse -Force -ErrorAction Stop
}
'''

# Actions are explicitly scoped so each platform sees each name exactly once.
# macOS and Linux retain the original POSIX commands. Windows actions use a child
# PowerShell so profile/debug variables do not leak into later terminal commands.

[[actions]]
name = "Work"
icon = "run"
platform = "darwin"
command = '''
nvm use --silent
corepack enable
PWRAGENT_PROFILE=work pnpm dev
'''

[[actions]]
name = "Work"
icon = "run"
platform = "linux"
command = '''
nvm use --silent
corepack enable
PWRAGENT_PROFILE=work pnpm dev
'''

[[actions]]
name = "Work"
icon = "run"
platform = "win32"
command = '''
powershell.exe -NoProfile -Command {
  $ErrorActionPreference = "Stop"
  $nodeVersion = (Get-Content -LiteralPath .nvmrc -Raw -ErrorAction Stop).Trim().TrimStart('v')
  nvm use $nodeVersion
  if ($LASTEXITCODE -ne 0) { throw "nvm use failed" }
  corepack.cmd enable
  if ($LASTEXITCODE -ne 0) { throw "corepack enable failed" }
  $env:PWRAGENT_PROFILE = "work"
  pnpm.cmd dev
  exit $LASTEXITCODE
}
'''

