name: Development Check Performance

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline revision in this repository
        required: true
        default: main
      candidate:
        description: Candidate revision in this repository
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: check-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare checks on one macOS runner
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:benchmark-checks') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci:benchmark-checks'))
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Temporary diagnostic branch for PR #3420; do not merge this workflow.
      - uses: actions/checkout@v7
        with:
          path: diagnostics

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline }}
          path: baseline

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate }}
          path: candidate

      - name: Install baseline dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "24.22.1"
          working-directory: baseline
          cache-electron: "true"
      - name: Install candidate dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "24.22.1"
          working-directory: candidate
          cache-electron: "true"
      - name: Turn off Spotlight indexing
        continue-on-error: true
        timeout-minutes: 2
        run: sudo mdutil -a -i off

      - name: Select an Xcode with actool 26
        id: xcode
        uses: ./diagnostics/.github/actions/select-xcode-for-actool

      - name: Measure messaging cold start on both revisions
        env:
          DEVELOPER_DIR: ${{ steps.xcode.outputs.developer-dir }}
          PWRAGENT_REQUIRE_ACTOOL: "1"
        run: node diagnostics/scripts/ci/messaging-cold-start.mjs baseline candidate .local/check-performance
      - name: Upload timings, load samples and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-performance-${{ runner.name }}-${{ github.run_attempt }}
          path: .local/check-performance/
          include-hidden-files: true
          if-no-files-found: warn
