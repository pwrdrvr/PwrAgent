name: Development Check Performance

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline revision in this repository
        required: true
        default: main
      candidate:
        description: Candidate revision in this repository
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: check-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare checks on one macOS runner
    # Never execute public-fork code on the restricted self-hosted group.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'ci:benchmark-checks') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci:benchmark-checks'))
    runs-on: [self-hosted, macOS, ARM64, pwrdrvr-macos]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline }}
          path: baseline

      # Clear the local flag before disabling worktree sparse state; otherwise
      # checkout exposes a previous non-cone bootstrap's local true value.
      - name: Restore complete checkout
        working-directory: baseline
        shell: bash
        run: |
          git config --local core.sparseCheckout false
          git sparse-checkout disable
          git config --local --unset-all extensions.worktreeConfig

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate }}
          path: candidate

      # Clear the local flag before disabling worktree sparse state; otherwise
      # checkout exposes a previous non-cone bootstrap's local true value.
      - name: Restore complete checkout
        working-directory: candidate
        shell: bash
        run: |
          git config --local core.sparseCheckout false
          git sparse-checkout disable
          git config --local --unset-all extensions.worktreeConfig

      - name: Locate the guest cache root
        shell: bash
        run: echo "PWRAGENT_CI_CACHE_ROOT=$HOME/Library/Caches/pwragent-ci" >> "$GITHUB_ENV"

      - name: Install baseline dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        with:
          node-version: "24.22.1"
          working-directory: baseline
          cache-electron: "true"
          persistent-store-dir: ${{ env.PWRAGENT_CI_CACHE_ROOT }}
      - name: Install candidate dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        with:
          node-version: "24.22.1"
          working-directory: candidate
          cache-electron: "true"
          persistent-store-dir: ${{ env.PWRAGENT_CI_CACHE_ROOT }}
      - name: Measure identical check slices on this runner
        run: node candidate/scripts/ci/benchmark-dev-checks.mjs baseline candidate .local/check-performance
      - name: Upload timings, load samples and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-performance-${{ runner.name }}-${{ github.run_attempt }}
          path: .local/check-performance/
          include-hidden-files: true
          if-no-files-found: warn
