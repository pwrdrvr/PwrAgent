name: CI

on:
  push:
    branches:
      - main
      - "releases/**"
  pull_request:
    # Do not add `labeled` back here. Dependabot applies labels to dependency
    # PRs, and label-triggered CI creates skipped check suites that can make
    # those PRs appear to have no real status checks. If a label-gated path
    # needs to run, add the label and push a commit or rerun CI.
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  # PRs share one group per PR number, so a new push cancels the run it
  # supersedes instead of leaving three obsolete builds holding runners.
  #
  # Pushes group on the commit SHA, so no two pushes ever share a group. That
  # matters more than it looks: the default queue is `single`, which keeps at
  # most one run pending per group and cancels the pending run a newer one
  # replaces. A branch-name group with cancel-in-progress disabled would
  # therefore drop the middle commit of any three merged in quick succession,
  # which is exactly the history needed to tell which commit broke main.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Keep the pull_request trigger path-unfiltered so the required check jobs
  # exist on every PR. Documentation-only PRs skip those jobs below instead.
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_impacting: ${{ steps.classify.outputs.code_impacting }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Classify changed files
        id: classify
        uses: actions/github-script@v9
        with:
          script: |
            const fullCi = (reason) => {
              core.setOutput("code_impacting", "true");
              core.setOutput("docs_only", "false");
              core.notice(`Running full CI: ${reason}`);
            };

            if (context.eventName !== "pull_request") {
              fullCi(`${context.eventName} events are never docs-only`);
              return;
            }

            let files;
            try {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
            } catch (error) {
              fullCi(`changed-file lookup failed (${error.message})`);
              return;
            }

            const reportedCount = context.payload.pull_request.changed_files;
            if (files.length === 0 || files.length !== reportedCount) {
              fullCi(
                `changed-file list was incomplete (received ${files.length} of ${reportedCount})`,
              );
              return;
            }

            const isDocumentationPath = (path) =>
              path.startsWith("docs/") || path.toLowerCase().endsWith(".md");
            const codeImpactingFile = files.find((file) => {
              const paths = [file.filename, file.previous_filename].filter(Boolean);
              return paths.some((path) => !isDocumentationPath(path));
            });
            const docsOnly = codeImpactingFile === undefined;

            core.setOutput("code_impacting", String(!docsOnly));
            core.setOutput("docs_only", String(docsOnly));
            await core.summary
              .addHeading("Changed-file classification")
              .addTable([
                [{data: "Classification", header: true}, {data: "Files", header: true}],
                [docsOnly ? "Documentation only" : "Code impacting", String(files.length)],
              ])
              .addRaw(
                docsOnly
                  ? "Only `docs/**` and Markdown files changed; expensive CI jobs are skipped."
                  : `Full CI runs because \`${codeImpactingFile.filename}\` is not documentation-only.`,
              )
              .write();

  install-deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          sparse-checkout: |
            **/package.json
            .pnpmfile.cjs
            patches/**
            pnpm-lock.yaml
            pnpm-workspace.yaml
            scripts/linux-sandbox.mjs
            apps/desktop/scripts/ensure-electron-runtime.mjs
          sparse-checkout-cone-mode: false

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"
          lookup-only: "true"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"

      - name: License metadata
        timeout-minutes: 10
        run: pnpm licenses:check

      - name: SQL template safety
        timeout-minutes: 10
        run: pnpm lint:sql

      - name: Codex storage boundary
        timeout-minutes: 10
        run: pnpm lint:codex-storage

      - name: Renderer color literals
        timeout-minutes: 10
        run: pnpm lint:colors

      - name: Electron version policy
        timeout-minutes: 10
        run: pnpm lint:electron-version

      - name: Oxlint
        timeout-minutes: 10
        run: pnpm lint:oxlint

      - name: Typed lint
        timeout-minutes: 10
        run: pnpm lint:oxlint:typed

      - name: Type check
        timeout-minutes: 10
        run: pnpm typecheck

      - name: Dependency boundaries
        timeout-minutes: 10
        run: |
          pnpm exec depcruise --config .dependency-cruiser.cjs \
            --output-type json --output-to cruise-result.json \
            packages/ apps/desktop/src/
          pnpm exec depcruise-fmt --exit-code cruise-result.json

      - name: Boundary violation summary
        if: failure()
        timeout-minutes: 10
        run: |
          pnpm exec depcruise-fmt -T markdown cruise-result.json >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"

      - name: Build
        timeout-minutes: 10
        run: pnpm run build

  test:
    # Two shards, as the Windows lanes run. The single lane reached its
    # 10-minute step budget on 2026-10-10 and the suite grows a few seconds a
    # day; each lane keeps that budget rather than raising it. Setup before
    # the test step costs about 30s per lane.
    name: Test (lane ${{ matrix.lane }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    strategy:
      # Keep the other lane running after a failure so it still reports.
      fail-fast: false
      matrix:
        lane: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"

      - name: Install ripgrep
        uses: ./.github/actions/install-ripgrep
        timeout-minutes: 5

      - name: Test
        timeout-minutes: 10
        run: pnpm test --shard=${{ matrix.lane }}/2

      - name: Test standalone headless CLI
        if: matrix.lane == 1
        timeout-minutes: 2
        run: pnpm --filter pwragent test

  test-result:
    # Preserve the required `Test` status-check context while the work runs
    # as matrix lanes. `always()` is required so a failed lane reaches this
    # job and cannot turn the aggregate check into a skip: branch protection
    # counts a skipped required check as satisfied. The lane result is read
    # in the step below rather than gating entry to the job.
    name: Test
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: >-
      always() &&
      needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 5
    steps:
      - name: Require every Test lane
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          # Mirror the result into the job summary, as the Desktop E2E gate
          # does, so the checks page says why the gate failed.
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "- FAIL \`Test\` lanes ($TEST_RESULT); see the failing \`Test (lane N of 2)\` job" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::A Test lane did not succeed ($TEST_RESULT)."
            exit 1
          fi
          echo "- PASS \`Test\` lanes ($TEST_RESULT)" >> "$GITHUB_STEP_SUMMARY"
          echo "Every Test lane succeeded."

  windows-install-deps:
    name: Setup Windows Dependencies
    runs-on: windows-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          sparse-checkout: |
            **/package.json
            .pnpmfile.cjs
            patches/**
            pnpm-lock.yaml
            pnpm-workspace.yaml
            scripts/linux-sandbox.mjs
            apps/desktop/scripts/ensure-electron-runtime.mjs
          sparse-checkout-cone-mode: false

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          working-directory: .
          cache-electron: "true"
          lookup-only: "true"

  windows-verify:
    name: Windows verify
    runs-on: windows-latest
    needs: [changes, windows-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          working-directory: .
          cache-electron: "true"

      - name: Type check
        timeout-minutes: 10
        run: pnpm typecheck

      - name: Build
        timeout-minutes: 15
        run: pnpm run build

  windows-desktop-main:
    name: Windows desktop-main (lane ${{ matrix.lane }} of 2)
    runs-on: windows-latest
    needs: [changes, windows-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          working-directory: .
          cache-electron: "true"

      - name: Test
        env:
          PWRAGENT_UNBORN_WORKSPACE_TRACE: "1"
        timeout-minutes: 20
        # Keep a common MSYS parent alive while parallel workers launch Git
        # and Bash. Independent starts from PowerShell can race MSYS shared
        # mount initialization (fatal add_item, errno 1).
        # https://github.com/git-for-windows/git/issues/1135#issuecomment-4757184373
        shell: bash
        # The deploy-isolation test launches pnpm's native executable directly
        # to avoid Windows .cmd handoffs; pnpm supplies it in npm_execpath.
        run: pnpm test --project desktop-main --shard=${{ matrix.lane }}/2

  windows-renderer-packages:
    name: Windows renderer + packages (lane ${{ matrix.lane }} of 2)
    runs-on: windows-latest
    needs: [changes, windows-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          working-directory: .
          cache-electron: "true"

      - name: Install ripgrep
        timeout-minutes: 5
        uses: ./.github/actions/install-ripgrep

      - name: Test
        timeout-minutes: 20
        run: >-
          pnpm exec vitest run --config vitest.workspace.ts
          --project desktop-renderer
          --project desktop-renderer-node
          --project messaging
          --project shared
          --shard=${{ matrix.lane }}/2

  windows-package:
    name: Windows installer (label-gated)
    # Opt-in only: add the `ci:windows-package` label to a PR to validate the
    # Windows NSIS installer build. Off by default — never runs on normal
    # PRs/pushes, so the packaging cost is paid only on demand.
    needs: changes
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:windows-package') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 15
        with:
          node-version: "^24.22.1"
          working-directory: .
          cache-electron: "true"

      - name: Prepare Windows installer signing input
        timeout-minutes: 25
        run: node apps/desktop/scripts/release.mjs --win --prepare-only

      # Exercise the same archive boundary as the protected release job without
      # granting this PR job signing credentials.
      - name: Archive and expand Windows installer signing input
        timeout-minutes: 10
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "windows-installer-pr-input.tgz"
          ./scripts/release/archive-windows-signing-input.ps1 -ArchivePath $archive
          $input = Join-Path $env:RUNNER_TEMP "windows-installer-pr-input"
          New-Item -ItemType Directory -Path $input -Force | Out-Null
          Push-Location $input
          & tar.exe -xzf $archive
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to expand Windows installer signing input (exit code $LASTEXITCODE)."
          }
          Pop-Location

      - name: Package Windows installer from prepared input (unsigned, no publish)
        timeout-minutes: 25
        shell: pwsh
        run: |
          $input = Join-Path $env:RUNNER_TEMP "windows-installer-pr-input"
          Push-Location $input
          node apps/desktop/scripts/release.mjs --win --sign-stage-only --no-publish
          Pop-Location

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: windows-installer-pr
          path: |
            ${{ runner.temp }}/windows-installer-pr-input/apps/desktop/release-stage/dist/*.exe
            ${{ runner.temp }}/windows-installer-pr-input/apps/desktop/release-stage/dist/*.exe.blockmap
            ${{ runner.temp }}/windows-installer-pr-input/apps/desktop/release-stage/dist/SHA256SUMS
          retention-days: 7

  desktop-e2e:
    name: Linux Desktop E2E (lane ${{ matrix.lane }} of 4)
    runs-on: ubuntu-latest
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    strategy:
      # Playwright shards by test COUNT, in file order, without regard to
      # duration, and a shard boundary never splits a group: with
      # `fullyParallel: false` each file is one group. `a11y.spec.ts` sorts
      # first. At 66 tests (six surfaces in each of eleven color themes) and
      # ~3.5s apiece on macOS against ~2.4s for the rest of the suite, it sat
      # whole in lane 1 as one group. That lane ran 249s of tests on macOS
      # against 145-184s for the other lanes, and set the end of the whole CI
      # run. It is now 57 tests: five surfaces in each of eleven color
      # themes, plus the composer autocomplete block in the two Tangerine
      # themes.
      #
      # Two settings move that work. `a11y.spec.ts` runs in `parallel` mode,
      # so each of its tests is its own group (workers stay at 1, so this
      # changes grouping only). PWTEST_SHARD_WEIGHTS on the test step then
      # sizes the lanes 9:12:12:14 by test count. When they were fit, with
      # 66 a11y tests, that was 54/71/71/82 of 278: lane 1 took 54 a11y
      # tests and lane 2 the rest. The weights count
      # tests, not seconds. They were fit to per-test times from CI runs on
      # all three platforms: a11y is relatively slowest on Linux, and the
      # late files are slowest on Windows, so one set of weights cannot even
      # out every platform. This set minimizes the worst lane summed over
      # the three, which models macOS at ~178-198s per lane (was 158-234s).
      # Refit them when a11y's cost or the suite's size moves a lane well
      # off the others. Each lane's test count is the `Running N tests using
      # 1 worker, shard K of 4` log line.
      #
      # The Linux, macOS and Windows test steps set the same weights and all
      # run four lanes, so a lane number names the same tests on every
      # platform. Change all three together.
      #
      # GitHub-hosted Linux capacity can run every lane concurrently. Keep
      # the other shards running after a failure so their artifacts still
      # show whether the failure is isolated or suite-wide.
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [1, 2, 3, 4]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        # macOS visual baselines are LFS objects. The Linux suite currently
        # skips that platform-specific visual spec, but fetching them here
        # keeps checkout behavior ready for future Linux coverage too.
        with:
          lfs: true

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"

      - name: Install Linux window manager
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openbox x11-utils

      - name: Run desktop replay-backed Electron tests
        timeout-minutes: 10
        env:
          # Lane sizes by test count; see the strategy comment above.
          PWTEST_SHARD_WEIGHTS: "9:12:12:14"
        # Wide-layout specs request 1440px windows. Keep the virtual desktop
        # larger so Openbox does not constrain them to Xvfb's default width.
        # Keep Xvfb from resetting while short-lived readiness probes disconnect
        # and Openbox is still establishing its persistent display connection.
        run: >-
          xvfb-run --auto-servernum
          --server-args="-screen 0 1920x1080x24 -noreset"
          bash .github/scripts/run-linux-desktop-e2e.sh
          --shard=${{ matrix.lane }}/4

      - name: Upload desktop Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: desktop-e2e-linux-lane-${{ matrix.lane }}-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 30

  desktop-e2e-result:
    # Preserve the required status-check context while the work runs as
    # independently named matrix jobs across more than one platform.
    # `always()` is required so a failed lane reaches this job and cannot turn
    # the aggregate check into a skip — branch protection counts a skipped
    # required check as satisfied, so without it the gate would stop gating in
    # exactly the case it exists for. Each lane is read from `needs.*.result`
    # in the step below rather than gating entry to the job.
    #
    # `windows-e2e` is deliberately absent. It landed 2026-09-14 as an
    # explicitly advisory lane and is not yet stable enough to gate merges: on
    # the 20 `main` runs after it landed, 7 had at least one Windows lane fail
    # (lane 3 alone failed 6 times), so gating would have reddened roughly one
    # main run in three for reasons unrelated to the change under test.
    #
    # Promote it once #2139 — which fixes the Star Map readiness failures those
    # lanes actually hit — has merged and `main` has held a green Windows
    # baseline. Adding it is then one entry in `needs` plus one `require` call.
    # pwrdrvr/PwrGit and pwrdrvr/PwrSnap already gate their Windows lanes;
    # keep this job's shape identical to theirs so the three cannot drift.
    name: Desktop E2E
    runs-on: ubuntu-latest
    needs: [changes, desktop-e2e, desktop-e2e-macos]
    if: >-
      always() &&
      needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 5
    steps:
      - name: Require the Linux and macOS Desktop E2E lanes
        env:
          LINUX_E2E_RESULT: ${{ needs.desktop-e2e.result }}
          MACOS_E2E_RESULT: ${{ needs.desktop-e2e-macos.result }}
        run: |
          set -euo pipefail

          # Mirror each line into the job summary so the PR checks page names
          # the platform that broke without anyone opening the job log.
          say() {
            echo "$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          # Report every platform before exiting, so a red gate names the
          # platform that broke instead of stopping at the first check and
          # hiding whether the others were healthy.
          status=0
          require() {
            if [[ "$2" == "success" ]]; then
              say "- PASS \`$1\` ($2)"
            else
              say "- FAIL \`$1\` ($2)"
              echo "::error::$1 Desktop E2E did not succeed ($2)."
              status=1
            fi
          }

          say "### Desktop E2E platform results"
          require "Linux" "$LINUX_E2E_RESULT"
          require "macOS" "$MACOS_E2E_RESULT"

          exit "$status"
  macos-install-deps:
    name: Setup macOS Dependencies
    # Free GitHub-hosted Apple Silicon (standard size). Every Mac job uses
    # macos-26: actool 26 compiles build/icon.icon and needs a macOS 26 host.
    # configure-nodejs keys the store on runner.os + runner.arch, so this
    # primes the cache the unit and E2E lanes restore. Do not use
    # macos-26-intel or a paid larger size.
    if: needs.changes.outputs.code_impacting == 'true'
    runs-on: macos-26
    needs: changes
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          sparse-checkout: |
            **/package.json
            .pnpmfile.cjs
            patches/**
            pnpm-lock.yaml
            pnpm-workspace.yaml
            scripts/linux-sandbox.mjs
            apps/desktop/scripts/ensure-electron-runtime.mjs
          sparse-checkout-cone-mode: false

      # Only populate the dependency cache on a miss. The parallel consumers
      # restore it after this job (including cache saves) succeeds.
      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"
          lookup-only: "true"

  test-macos:
    name: macOS unit tests (lane ${{ matrix.lane }} of 2)
    runs-on: macos-26
    needs: [changes, macos-install-deps]
    # Exercise the release unit-test platform before a tag is cut.
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"

      # electron-builder compiles build/icon.icon with actool 26. The macos-26
      # host supplies the matching AssetCatalogAgent runtime; this action
      # verifies the selected Xcode still has actool 26+. Only the test step
      # sets DEVELOPER_DIR, so native setup keeps the image toolchain and SDK.
      - name: Select an Xcode with actool 26
        id: xcode
        uses: ./.github/actions/select-xcode-for-actool

      - name: Test (unit)
        env:
          # Require the icon compile check wherever Vitest assigns its suite.
          DEVELOPER_DIR: ${{ steps.xcode.outputs.developer-dir }}
          PWRAGENT_REQUIRE_ACTOOL: "1"
        run: pnpm test --shard=${{ matrix.lane }}/2

      - name: Upload failed unit shutdown probes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-unit-shutdown-probes-lane-${{ matrix.lane }}
          path: apps/desktop/test-results/unit-shutdown-probes/
          if-no-files-found: ignore
          retention-days: 7

  desktop-e2e-macos:
    name: macOS Desktop E2E (lane ${{ matrix.lane }} of 4)
    # GitHub-hosted, fresh VM per job, so fork PRs run here too. Never move
    # this lane back to self-hosted machines: this is a public repository.
    if: needs.changes.outputs.code_impacting == 'true'
    runs-on: macos-26
    needs: [changes, macos-install-deps]
    strategy:
      # Four lanes keep each Playwright process to roughly half the Electron
      # launches of a two-lane split, matching the Linux and Windows lanes.
      # Hosted macOS concurrency is capped per account, so a lane with no free
      # runner queues instead.
      #
      # Do not cancel the other shards on failure: their artifacts distinguish
      # a product failure from runner trouble.
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        # macOS visual baselines are LFS objects.
        with:
          lfs: true

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"

      - name: Run desktop replay-backed Electron tests
        # Hosted macOS runners are VMs with a paravirtual GPU, which can reset
        # under Electron load. The early PWRAGENT_E2E_DISABLE_GPU gate selects
        # software rendering before Electron initializes, while ordinary host
        # E2E keeps GPU coverage. test:e2e builds apps/desktop/out first.
        # The shutdown circuit is macOS-lane-only: two consecutive closes at
        # or above 4s (or requiring force-kill) stop this shard after cleanup.
        timeout-minutes: 25
        env:
          PWRAGENT_E2E_DISABLE_GPU: "1"
          PWRAGENT_E2E_SHUTDOWN_CIRCUIT_BREAKER: "1"
          # Same lane sizes as Linux and Windows; see the desktop-e2e
          # strategy comment.
          PWTEST_SHARD_WEIGHTS: "9:12:12:14"
        # The wrapper keeps a cancelled step alive until Playwright has closed
        # Electron, and kills Electron's main first if the runner escalates.
        # Without it, the runner's orphan reap killed the renderer under a
        # pending failure screenshot and the main segfaulted; see the script.
        # `exec` makes the wrapper the step process, so it gets the signals.
        run: >-
          exec bash ./scripts/ci/macos-e2e-run-lane.sh
          pnpm --filter @pwragent/desktop test:e2e
          --shard=${{ matrix.lane }}/4

      - name: Upload macOS Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: desktop-e2e-macos-lane-${{ matrix.lane }}-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 30

  windows-e2e:
    name: Windows Desktop E2E (lane ${{ matrix.lane }} of 4)
    # Advisory while the lane establishes a baseline: it is deliberately absent
    # from `desktop-e2e-result`, so a Windows-only failure cannot block a merge
    # yet. Promote it into that aggregate once it has been green for a while.
    #
    # Until this job existed, `e2e/windows-codex-discovery.spec.ts` and
    # `e2e/windows-titlebar-hover.spec.ts` had never executed on any runner:
    # both are ordinary members of the suite that self-skip off win32, and no
    # lane ran Playwright on Windows. The first guards native `.cmd` discovery
    # and launch, which is exactly the Git-for-Windows launcher-handoff class
    # that CLAUDE.md records as expensive.
    runs-on: windows-latest
    needs: [changes, windows-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    strategy:
      # Keep the other lanes running after a failure so their artifacts show
      # whether a failure is isolated or suite-wide, exactly as the Linux and
      # macOS matrices do. Hosted Windows capacity runs all four concurrently,
      # so no max-parallel cap is needed.
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4]
    # One budget for setup, build, tests, and reporting. Do not add shorter
    # step or suite deadlines that interrupt a progressing lane before this cap.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        # No `lfs: true` here, unlike the Linux and macOS lanes. The only LFS
        # objects in the tree are the two darwin visual baselines, and
        # `visual-regression.spec.ts` skips off darwin/arm64.

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        with:
          node-version: "^24.22.1"
          working-directory: .
          cache-electron: "true"

      - name: Prepare official Windows handle diagnostics
        continue-on-error: true
        shell: pwsh
        run: |
          $diagnosticToolDirectory = Join-Path $env:RUNNER_TEMP "pwragent-pipe-handles"
          New-Item -ItemType Directory -Path $diagnosticToolDirectory -Force | Out-Null
          $diagnosticArchive = Join-Path $diagnosticToolDirectory "Handle.zip"
          Invoke-WebRequest "https://download.sysinternals.com/files/Handle.zip" -OutFile $diagnosticArchive
          Expand-Archive -LiteralPath $diagnosticArchive -DestinationPath $diagnosticToolDirectory -Force
          $diagnosticHandlePath = Join-Path $diagnosticToolDirectory "handle64.exe"
          $diagnosticSignature = Get-AuthenticodeSignature -LiteralPath $diagnosticHandlePath
          if ($diagnosticSignature.Status -ne "Valid" -or $diagnosticSignature.SignerCertificate.Subject -notmatch "(^|, )O=Microsoft Corporation(,|$)") {
            throw "Official Handle signature verification failed; diagnostics will be unavailable."
          }
          "PWRAGENT_WINDOWS_HANDLE_EXE=$diagnosticHandlePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run desktop replay-backed Electron tests
        # windows-latest provides an interactive desktop session, so unlike the
        # Linux lane this needs neither xvfb nor a window manager.
        #
        # Sharding matches the Linux and macOS lanes exactly: the same
        # grouping (file-level, except `a11y.spec.ts`, which runs in
        # `parallel` mode) and the same weights. A Windows-only failure is
        # then attributable to Windows and not to a different lane split.
        # See the desktop-e2e strategy comment.
        env:
          PWTEST_SHARD_WEIGHTS: "9:12:12:14"
        run: >-
          pnpm test:desktop-e2e:windows-diagnostics
          --shard=${{ matrix.lane }}/4

      - name: Upload desktop Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: desktop-e2e-windows-lane-${{ matrix.lane }}-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 30
