name: CI

on:
  push:
    branches:
      - main
      - "releases/**"
  pull_request:
    # Do not add `labeled` back here. Dependabot applies labels to dependency
    # PRs, and label-triggered CI creates skipped check suites that can make
    # those PRs appear to have no real status checks. If a label-gated path
    # needs to run, add the label and push a commit or rerun CI.
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  # PRs share one group per PR number, so a new push cancels the run it
  # supersedes instead of leaving three obsolete builds holding runners.
  #
  # Pushes group on the commit SHA, so no two pushes ever share a group. That
  # matters more than it looks: the default queue is `single`, which keeps at
  # most one run pending per group and cancels the pending run a newer one
  # replaces. A branch-name group with cancel-in-progress disabled would
  # therefore drop the middle commit of any three merged in quick succession,
  # which is exactly the history needed to tell which commit broke main.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Keep the pull_request trigger path-unfiltered so the required check jobs
  # exist on every PR. Docs and agent-skill-only PRs skip expensive jobs below.
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_impacting: ${{ steps.classify.outputs.code_impacting }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      blacksmith_trial: ${{ steps.classify.outputs.blacksmith_trial }}
      # `true` runs the macOS unit tests, macOS Desktop E2E and Windows
      # Desktop E2E. Pull requests leave them to `main` unless the `ci:full`
      # label is present or a platform-specific path changed, because on PRs
      # they rarely catch what the Linux and Windows lanes miss (see the
      # README in this directory for the measurements). Every push, and every
      # case this script cannot decide, runs them.
      full_platforms: ${{ steps.classify.outputs.full_platforms }}
      # `true` runs the accessibility audit (the `desktop-a11y` job). A pull
      # request runs it only with `ci:full` or `ci:a11y`, when it changes
      # `a11y.spec.ts`, or wherever `full_platforms` is `true`; a narrowed
      # test plan that selects the spec also runs it. Every push runs it.
      a11y: ${{ steps.classify.outputs.a11y }}
    steps:
      # Docs-only PRs skip Lint, so the instruction-size guard runs here,
      # where every PR and push passes through.
      - name: Checkout agent instructions
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          # Non-cone patterns match at any depth, so this checks out every
          # nested AGENTS.md and AGENTS.override.md the size guard reads.
          sparse-checkout: |
            AGENTS.md
            AGENTS.override.md
            scripts/check-agent-instructions-size.mjs
          sparse-checkout-cone-mode: false

      - name: Check AGENTS.md sizes
        run: node ./scripts/check-agent-instructions-size.mjs

      - name: Classify changed files
        id: classify
        uses: actions/github-script@v9
        with:
          script: |
            const fullCi = (reason) => {
              core.setOutput("code_impacting", "true");
              core.setOutput("docs_only", "false");
              core.setOutput("full_platforms", "true");
              core.setOutput("a11y", "true");
              core.notice(`Running full CI: ${reason}`);
            };

            if (context.eventName !== "pull_request") {
              fullCi(`${context.eventName} events always run full CI`);
              return;
            }

            // Read labels live. A rerun replays the original event payload,
            // so a label added after the push is visible only through the
            // API. "Re-run failed jobs" does not rerun this succeeded job:
            // after adding the label, use "Re-run all jobs" or push.
            let labels;
            try {
              labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
            } catch (error) {
              fullCi(`label lookup failed (${error.message})`);
              return;
            }
            core.setOutput("blacksmith_trial", String(
              context.payload.pull_request.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
              && labels.some((label) => label.name === "ci:blacksmith"),
            ));
            if (labels.some((label) => label.name === "ci:full")) {
              fullCi("the ci:full label is present");
              return;
            }

            let files;
            try {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
            } catch (error) {
              fullCi(`changed-file lookup failed (${error.message})`);
              return;
            }

            const reportedCount = context.payload.pull_request.changed_files;
            if (files.length === 0 || files.length !== reportedCount) {
              fullCi(
                `changed-file list was incomplete (received ${files.length} of ${reportedCount})`,
              );
              return;
            }

            const isNonProductPath = (path) =>
              path.startsWith("docs/")
              || path.toLowerCase().endsWith(".md")
              || path.startsWith(".agents/skills/");
            // Changes that require native platform coverage: the lockfile
            // (Electron and native modules), platform-specific specs and
            // baselines, detached onboarding handoffs, the macOS native
            // plug-ins, app icon and the scripts that build them (their
            // tests self-skip off darwin or need actool), and the macOS lane
            // scripts.
            const isPlatformPath = (path) =>
              path === "pnpm-lock.yaml"
              || path === "apps/desktop/e2e/get-started.spec.ts"
              || path === "apps/desktop/e2e/fixtures/detached-profile-instances.ts"
              || path.startsWith("apps/desktop/e2e/visual-regression.spec.ts")
              || path.startsWith("apps/desktop/e2e/macos-")
              || path.startsWith("apps/desktop/e2e/windows-")
              || path.startsWith("apps/desktop/native/")
              || path.startsWith("apps/desktop/build/")
              || path.startsWith("apps/desktop/scripts/macos-")
              || path.startsWith("apps/desktop/scripts/assemble-mac-")
              || path.startsWith("apps/desktop/scripts/app-icon")
              || (path.startsWith("apps/desktop/scripts/") && path.endsWith(".swift"))
              || (path.startsWith("apps/desktop/scripts/") && path.includes("dock-tile"))
              || path.startsWith("scripts/ci/macos-");
            const pathsOf = (file) => [file.filename, file.previous_filename].filter(Boolean);
            const platformFile = files.find((file) =>
              pathsOf(file).some((path) => !isNonProductPath(path) && isPlatformPath(path)));
            if (platformFile) {
              fullCi(`\`${platformFile.filename}\` requires macOS and Windows coverage`);
              return;
            }
            core.setOutput("full_platforms", "false");
            const a11yFile = files.find((file) =>
              pathsOf(file).includes("apps/desktop/e2e/a11y.spec.ts"));
            const a11y = labels.some((label) => label.name === "ci:a11y") || a11yFile !== undefined;
            core.setOutput("a11y", String(a11y));

            const codeImpactingFile = files.find((file) =>
              pathsOf(file).some((path) => !isNonProductPath(path)));
            const skipFullCi = codeImpactingFile === undefined;

            core.setOutput("code_impacting", String(!skipFullCi));
            core.setOutput("docs_only", String(skipFullCi));
            await core.summary
              .addHeading("Changed-file classification")
              .addTable([
                [{data: "Classification", header: true}, {data: "Files", header: true}],
                [skipFullCi ? "Documentation or agent skills only" : "Code impacting", String(files.length)],
              ])
              .addRaw(
                skipFullCi
                  ? "Only `docs/**`, Markdown, or `.agents/skills/**` changed; expensive CI jobs are skipped."
                  : `Product CI runs because \`${codeImpactingFile.filename}\` requires it. `
                    + "No platform-specific path changed, so the macOS unit tests, macOS Desktop E2E "
                    + "and Windows Desktop E2E run on `main`; "
                    + "to run them here, add the `ci:full` label, then push or use **Re-run all jobs** "
                    + "(\"Re-run failed jobs\" does not rerun this classifier). "
                    + (a11y
                      ? "The accessibility audit runs here."
                      : "The accessibility audit (`a11y.spec.ts`) also runs on `main`; "
                        + "to run it here, add the `ci:a11y` label, then push or use **Re-run all jobs**."),
              )
              .write();

  install-deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          sparse-checkout: |
            **/package.json
            .pnpmfile.cjs
            patches/**
            pnpm-lock.yaml
            pnpm-workspace.yaml
            scripts/linux-sandbox.mjs
            apps/desktop/scripts/ensure-electron-runtime.mjs
            apps/desktop/scripts/electron-runtime-cache.mjs
          sparse-checkout-cone-mode: false

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"
          lookup-only: "true"

  lint:
    name: Lint
    runs-on: ${{ needs.changes.outputs.blacksmith_trial == 'true' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 15
    needs: [changes, install-deps]
    # Branch protection counts a skipped required check as satisfied. When
    # the classifier fails (for example, its AGENTS.md size check),
    # every job that needs it would skip, so Lint runs instead and fails
    # on its own copy of the check.
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success'
        || needs.changes.outputs.code_impacting == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"

      - name: AGENTS.md sizes
        timeout-minutes: 1
        run: pnpm lint:agent-instructions

      - name: License metadata
        timeout-minutes: 10
        run: pnpm licenses:check

      - name: SQL template safety
        timeout-minutes: 10
        run: pnpm lint:sql

      - name: Codex storage boundary
        timeout-minutes: 10
        run: pnpm lint:codex-storage

      - name: Renderer color literals
        timeout-minutes: 10
        run: pnpm lint:colors

      - name: Electron version policy
        timeout-minutes: 10
        run: pnpm lint:electron-version

      - name: Release publication time budget and isolation
        timeout-minutes: 1
        run: node scripts/check-release-publication-workflow.mjs

      - name: Renderer function bytecode budget
        timeout-minutes: 10
        run: pnpm check:renderer-bytecode

      - name: Main function bytecode budget
        timeout-minutes: 10
        run: pnpm check:main-bytecode --report main-bytecode.json

      - name: Upload main bytecode measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-bytecode
          path: main-bytecode.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Oxlint
        timeout-minutes: 10
        run: pnpm lint:oxlint

      - name: Typed lint
        timeout-minutes: 10
        run: pnpm lint:oxlint:typed

      - name: Type check
        timeout-minutes: 10
        run: pnpm typecheck

      - name: Dependency boundaries
        timeout-minutes: 10
        run: |
          pnpm exec depcruise --config .dependency-cruiser.cjs \
            --output-type json --output-to cruise-result.json \
            packages/ apps/desktop/src/
          pnpm exec depcruise-fmt --exit-code cruise-result.json

      - name: Boundary violation summary
        if: failure()
        timeout-minutes: 10
        run: |
          pnpm exec depcruise-fmt -T markdown cruise-result.json >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"

      - name: Build
        timeout-minutes: 10
        run: pnpm run build

  test:
    # Four shards. The single lane reached its 10-minute step budget on
    # 2026-10-10; two balanced lanes then reached it on 2026-11-17 because
    # GitHub-hosted runner speed varies by about ±20% between jobs. Each lane
    # keeps that budget rather than raising it. Balance the measured
    # main-process and renderer outliers instead of giving one hash shard twice
    # the test work. See docs/linux-unit-sharding.md. Setup before the test
    # step costs about 30s per lane.
    name: Test (lane ${{ matrix.lane }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, install-deps, pr-test-impact-plan]
    # A pull request's test plan can narrow these lanes; see the
    # `pr-test-impact-plan` job. `!cancelled()` lets them start when that
    # job is skipped or fails, and they then run the full suite.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code_impacting == 'true'
      && needs.install-deps.result == 'success' }}
    strategy:
      # Keep the other lane running after a failure so it still reports.
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.pr-test-impact-plan.outputs.unit_linux_lanes || '[1, 2, 3, 4]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"

      - name: Install ripgrep
        uses: ./.github/actions/install-ripgrep
        timeout-minutes: 5

      - name: Download the test plan
        if: needs.pr-test-impact-plan.outputs.unit_mode == 'selected'
        uses: actions/download-artifact@v8
        with:
          name: pr-test-impact-plan
          path: .local/ci/pr-test-impact

      - name: Test
        id: unit-tests
        continue-on-error: true
        timeout-minutes: 10
        env:
          PWRAGENT_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/unit-first.json
          PWRAGENT_DEV_SQLITE_WRITE_METRICS: ${{ github.event_name == 'pull_request' && '1' || '' }}
          PWRAGENT_DEV_SQLITE_WRITE_METRICS_FILE: ${{ github.event_name == 'pull_request' && format('{0}/.local/ci/sqlite-writes/first.jsonl', github.workspace) || '' }}
        run: >-
          ${{ needs.pr-test-impact-plan.outputs.unit_mode == 'selected'
          && format('pnpm exec node scripts/ci/run-pr-test-impact.mjs unit linux {0}', matrix.lane)
          || format('pnpm exec vitest run --config vitest.linux-ci.mts --shard={0}/4 --reporter=default --reporter=./scripts/ci/vitest-ci-reporter.mjs', matrix.lane) }}

      - name: Verify the unit slice completed
        id: unit-completion
        if: steps.unit-tests.outcome == 'success'
        run: node scripts/ci/run-retry-failures.mjs unit-verify

      - name: Retry failed unit tests
        id: unit-retry
        if: steps.unit-tests.outcome == 'failure'
        env:
          # Keep the same accounting on the retry so a budget mismatch still fails.
          PWRAGENT_DEV_SQLITE_WRITE_METRICS: ${{ github.event_name == 'pull_request' && '1' || '' }}
          PWRAGENT_DEV_SQLITE_WRITE_METRICS_FILE: ${{ github.event_name == 'pull_request' && format('{0}/.local/ci/sqlite-writes/retry.jsonl', github.workspace) || '' }}
        run: pnpm exec node scripts/ci/run-retry-failures.mjs unit

      - name: Record retry slice
        if: ${{ !cancelled() && always() }}
        continue-on-error: true
        uses: ./.github/actions/flake-slice
        with:
          kind: unit
          platform: linux
          lane: ${{ matrix.lane }}
          sample: 1
          job-status: ${{ job.status }}
          first-outcome: ${{ steps.unit-tests.outcome }}
          retry-outcome: ${{ steps.unit-retry.outcome }}

      - name: Upload unit retry reports
        if: ${{ !cancelled() && (steps.unit-tests.outcome == 'failure' || steps.unit-completion.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-unit-retry-lane-${{ matrix.lane }}
          path: .local/ci/retry/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Test standalone headless CLI
        if: matrix.lane == 1
        timeout-minutes: 2
        run: pnpm --filter pwragent test

      - name: Report SQLite writes
        id: sqlite-write-report
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (steps.unit-tests.outcome == 'success' || steps.unit-tests.outcome == 'failure') }}
        shell: bash
        env:
          RETRY_OUTCOME: ${{ steps.unit-retry.outcome }}
        run: |
          directory=.local/ci/sqlite-writes
          mkdir -p "$directory"
          attempts=(first)
          if [[ "$RETRY_OUTCOME" == success || "$RETRY_OUTCOME" == failure ]]; then
            attempts+=(retry)
          fi
          for attempt in "${attempts[@]}"; do
            {
              echo "SQLite writes ($attempt attempt)"
              if [[ -s "$directory/$attempt.jsonl" ]]; then
                node scripts/report-sqlite-writes.mjs "$directory/$attempt.jsonl" --top 15
              else
                echo "No SQLite writes recorded."
              fi
            } | tee "$directory/$attempt.txt"
          done

      - name: Upload SQLite write reports
        if: ${{ !cancelled() && steps.sqlite-write-report.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-unit-sqlite-writes-lane-${{ matrix.lane }}-attempt-${{ github.run_attempt }}
          path: .local/ci/sqlite-writes/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test-result:
    # Preserve the required `Test` status-check context while the work runs
    # as matrix lanes. `always()` is required so a failed lane reaches this
    # job and cannot turn the aggregate check into a skip: branch protection
    # counts a skipped required check as satisfied. The lane result is read
    # in the step below rather than gating entry to the job.
    name: Test
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: >-
      always() &&
      needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 5
    steps:
      - name: Require every Test lane
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          # Mirror the result into the job summary, as the Desktop E2E gate
          # does, so the checks page says why the gate failed.
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "- FAIL \`Test\` lanes ($TEST_RESULT); see the failing \`Test (lane N of 4)\` job" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::A Test lane did not succeed ($TEST_RESULT)."
            exit 1
          fi
          echo "- PASS \`Test\` lanes ($TEST_RESULT)" >> "$GITHUB_STEP_SUMMARY"
          echo "Every Test lane succeeded."

  windows-install-deps:
    name: Setup Windows Dependencies
    runs-on: windows-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          sparse-checkout: |
            **/package.json
            .pnpmfile.cjs
            patches/**
            pnpm-lock.yaml
            pnpm-workspace.yaml
            scripts/linux-sandbox.mjs
            apps/desktop/scripts/ensure-electron-runtime.mjs
            apps/desktop/scripts/electron-runtime-cache.mjs
          sparse-checkout-cone-mode: false

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          working-directory: .
          cache-electron: "true"
          lookup-only: "true"

  windows-verify:
    name: Windows verify
    runs-on: ${{ needs.changes.outputs.blacksmith_trial == 'true' && 'blacksmith-8vcpu-windows-2025' || 'windows-latest' }}
    needs: [changes, windows-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          working-directory: .
          cache-electron: "true"

      - name: Type check
        timeout-minutes: 10
        run: pnpm typecheck

      - name: Build
        timeout-minutes: 15
        run: pnpm run build

  windows-desktop-main:
    name: Windows desktop-main (lane ${{ matrix.lane }} of 4)
    runs-on: ${{ needs.changes.outputs.blacksmith_trial == 'true' && 'blacksmith-8vcpu-windows-2025' || 'windows-latest' }}
    needs: [changes, windows-install-deps, pr-test-impact-plan]
    # As on Linux, a pull request's test plan can narrow these lanes. A plan
    # that selects no desktop-main file leaves the lane list empty.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code_impacting == 'true'
      && needs.windows-install-deps.result == 'success'
      && needs.pr-test-impact-plan.outputs.unit_windows_main_lanes != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.pr-test-impact-plan.outputs.unit_windows_main_lanes || '[1, 2, 3, 4]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          working-directory: .
          cache-electron: "true"

      - name: Download the test plan
        if: needs.pr-test-impact-plan.outputs.unit_mode == 'selected'
        uses: actions/download-artifact@v8
        with:
          name: pr-test-impact-plan
          path: .local/ci/pr-test-impact

      - name: Test
        id: unit-tests
        continue-on-error: true
        # Native diagnostic builds and SQLite fixtures use os.tmpdir(). Keep
        # their outputs off the same stalling OS volume as the E2E fixtures.
        env:
          PWRAGENT_UNBORN_WORKSPACE_TRACE: "1"
          PWRAGENT_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/unit-first.json
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        timeout-minutes: 20
        # Keep a common MSYS parent alive while parallel workers launch Git
        # and Bash. Independent starts from PowerShell can race MSYS shared
        # mount initialization (fatal add_item, errno 1).
        # https://github.com/git-for-windows/git/issues/1135#issuecomment-4757184373
        shell: bash
        # The deploy-isolation test launches pnpm's native executable directly
        # to avoid Windows .cmd handoffs; pnpm supplies it in npm_execpath.
        run: >-
          ${{ needs.pr-test-impact-plan.outputs.unit_mode == 'selected'
          && format('pnpm exec node scripts/ci/run-pr-test-impact.mjs unit windows-main {0}', matrix.lane)
          || format('pnpm exec vitest run --config vitest.windows-main-ci.mts --project desktop-main --shard={0}/4 --reporter=default --reporter=./scripts/ci/vitest-ci-reporter.mjs', matrix.lane) }}

      - name: Verify the unit slice completed
        id: unit-completion
        # A narrowed lane writes no report when Windows collects none of its files.
        if: >-
          ${{ steps.unit-tests.outcome == 'success' && (needs.pr-test-impact-plan.outputs.unit_mode != 'selected'
          || hashFiles('.local/ci/retry/unit-first.json') != '') }}
        run: node scripts/ci/run-retry-failures.mjs unit-verify

      - name: Retry failed unit tests
        id: unit-retry
        if: steps.unit-tests.outcome == 'failure'
        shell: bash
        env:
          PWRAGENT_UNBORN_WORKSPACE_TRACE: "1"
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: pnpm exec node scripts/ci/run-retry-failures.mjs unit

      - name: Record retry slice
        if: ${{ !cancelled() && always() }}
        continue-on-error: true
        uses: ./.github/actions/flake-slice
        with:
          kind: unit
          platform: windows-main
          lane: ${{ matrix.lane }}
          sample: 1
          job-status: ${{ job.status }}
          first-outcome: ${{ steps.unit-tests.outcome }}
          retry-outcome: ${{ steps.unit-retry.outcome }}

      - name: Upload unit retry reports
        if: ${{ !cancelled() && (steps.unit-tests.outcome == 'failure' || steps.unit-completion.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-main-unit-retry-lane-${{ matrix.lane }}
          path: .local/ci/retry/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  windows-renderer-packages:
    name: Windows renderer + packages (lane ${{ matrix.lane }} of 2)
    runs-on: windows-latest
    needs: [changes, windows-install-deps, pr-test-impact-plan]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code_impacting == 'true'
      && needs.windows-install-deps.result == 'success'
      && needs.pr-test-impact-plan.outputs.unit_windows_renderer_lanes != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.pr-test-impact-plan.outputs.unit_windows_renderer_lanes || '[1, 2]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          working-directory: .
          cache-electron: "true"

      - name: Install ripgrep
        timeout-minutes: 5
        uses: ./.github/actions/install-ripgrep

      - name: Download the test plan
        if: needs.pr-test-impact-plan.outputs.unit_mode == 'selected'
        uses: actions/download-artifact@v8
        with:
          name: pr-test-impact-plan
          path: .local/ci/pr-test-impact

      - name: Test
        id: unit-tests
        continue-on-error: true
        timeout-minutes: 20
        env:
          PWRAGENT_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/unit-first.json
        # The project list is the one `unitGroups` gives this job in
        # scripts/ci/pr-test-impact.mjs. Change both together.
        run: >-
          ${{ needs.pr-test-impact-plan.outputs.unit_mode == 'selected'
          && format('pnpm exec node scripts/ci/run-pr-test-impact.mjs unit windows-renderer {0}', matrix.lane)
          || format('pnpm exec vitest run --config vitest.workspace.mts --project desktop-renderer --project desktop-renderer-node --project messaging --project owner-core --project shared --shard={0}/2 --reporter=default --reporter=./scripts/ci/vitest-ci-reporter.mjs', matrix.lane) }}

      - name: Verify the unit slice completed
        id: unit-completion
        # A narrowed lane writes no report when Windows collects none of its files.
        if: >-
          ${{ steps.unit-tests.outcome == 'success' && (needs.pr-test-impact-plan.outputs.unit_mode != 'selected'
          || hashFiles('.local/ci/retry/unit-first.json') != '') }}
        run: node scripts/ci/run-retry-failures.mjs unit-verify

      - name: Retry failed unit tests
        id: unit-retry
        if: steps.unit-tests.outcome == 'failure'
        run: pnpm exec node scripts/ci/run-retry-failures.mjs unit

      - name: Record retry slice
        if: ${{ !cancelled() && always() }}
        continue-on-error: true
        uses: ./.github/actions/flake-slice
        with:
          kind: unit
          platform: windows-renderer
          lane: ${{ matrix.lane }}
          sample: 1
          job-status: ${{ job.status }}
          first-outcome: ${{ steps.unit-tests.outcome }}
          retry-outcome: ${{ steps.unit-retry.outcome }}

      - name: Upload unit retry reports
        if: ${{ !cancelled() && (steps.unit-tests.outcome == 'failure' || steps.unit-completion.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-renderer-unit-retry-lane-${{ matrix.lane }}
          path: .local/ci/retry/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  windows-package:
    name: Windows installer (label-gated)
    # Opt-in only: add the `ci:windows-package` label to a PR to validate the
    # Windows NSIS installer build. Off by default — never runs on normal
    # PRs/pushes, so the packaging cost is paid only on demand.
    needs: changes
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:windows-package') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 15
        with:
          node-version: "^24.22.1"
          working-directory: .
          cache-electron: "true"

      - name: Prepare Windows installer signing input
        timeout-minutes: 25
        run: node apps/desktop/scripts/release.mjs --win --prepare-only

      # Exercise the same archive boundary as the protected release job without
      # granting this PR job signing credentials.
      - name: Archive and expand Windows installer signing input
        timeout-minutes: 10
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "windows-installer-pr-input.tgz"
          ./scripts/release/archive-windows-signing-input.ps1 -ArchivePath $archive
          $input = Join-Path $env:RUNNER_TEMP "windows-installer-pr-input"
          New-Item -ItemType Directory -Path $input -Force | Out-Null
          Push-Location $input
          & tar.exe -xzf $archive
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to expand Windows installer signing input (exit code $LASTEXITCODE)."
          }
          Pop-Location

      - name: Package Windows installer from prepared input (unsigned, no publish)
        timeout-minutes: 25
        shell: pwsh
        run: |
          $input = Join-Path $env:RUNNER_TEMP "windows-installer-pr-input"
          Push-Location $input
          node apps/desktop/scripts/release.mjs --win --sign-stage-only --no-publish
          Pop-Location

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: windows-installer-pr
          path: |
            ${{ runner.temp }}/windows-installer-pr-input/apps/desktop/release-stage/dist/*.exe
            ${{ runner.temp }}/windows-installer-pr-input/apps/desktop/release-stage/dist/*.exe.blockmap
            ${{ runner.temp }}/windows-installer-pr-input/apps/desktop/release-stage/dist/SHA256SUMS
          retention-days: 7

  desktop-e2e:
    name: Linux Desktop E2E (lane ${{ matrix.lane }} of 5)
    runs-on: ubuntu-latest
    needs: [changes, install-deps, pr-test-impact-plan]
    # A pull request's test plan can narrow these lanes to one that runs the
    # selected specs, or to none when no spec is affected. `!cancelled()`
    # lets them start when the plan job is skipped or fails, and they then
    # run the full suite.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code_impacting == 'true'
      && needs.install-deps.result == 'success'
      && needs.pr-test-impact-plan.outputs.e2e_lanes != '[]' }}
    strategy:
      # Playwright weights test counts, then assigns each indivisible group
      # by its first test's position. Files stay together; workers remain at
      # 1. Include platform-skipped tests in the allocation even though their
      # execution cost is negligible.
      #
      # These lanes never run `a11y.spec.ts`: the `desktop-a11y` job does,
      # when it runs at all. Fit 54:68:68:59:84 to the other 333 collected
      # tests on Linux, from seven full-suite PR runs. The longest modeled
      # lane is 223s. See docs/desktop-e2e-shard-timings.md for measurements.
      #
      # Windows keeps the audit in its own four lanes and has its own fit.
      # macOS uses a separate five-lane allocation to reduce job wall time.
      #
      # GitHub-hosted Linux capacity can run every lane concurrently. Keep
      # the other shards running after a failure so their artifacts still
      # show whether the failure is isolated or suite-wide.
      fail-fast: false
      max-parallel: 5
      matrix:
        lane: ${{ fromJSON(needs.pr-test-impact-plan.outputs.e2e_lanes || '[1, 2, 3, 4, 5]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        # macOS visual baselines are LFS objects. The Linux suite currently
        # skips that platform-specific visual spec, but fetching them here
        # keeps checkout behavior ready for future Linux coverage too.
        with:
          lfs: true

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"

      - name: Install Linux window manager
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openbox x11-utils

      - name: Download the test plan
        if: needs.pr-test-impact-plan.outputs.e2e_mode == 'selected'
        uses: actions/download-artifact@v8
        with:
          name: pr-test-impact-plan
          path: .local/ci/pr-test-impact

      - name: Run desktop replay-backed Electron tests
        id: e2e-tests
        continue-on-error: true
        timeout-minutes: 10
        env:
          E2E_MODE: ${{ needs.pr-test-impact-plan.outputs.e2e_mode }}
          PWRAGENT_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/e2e-first.json
          PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: ${{ github.workspace }}/.local/ci/retry/e2e-last.json
        # Wide-layout specs request 1440px windows. Keep the virtual desktop
        # larger so Openbox does not constrain them to Xvfb's default width.
        # Keep Xvfb from resetting while short-lived readiness probes disconnect
        # and Openbox is still establishing its persistent display connection.
        run: |
          set -euo pipefail
          if [[ "$E2E_MODE" == "selected" ]]; then
            mapfile -t tests < <(node scripts/ci/run-pr-test-impact.mjs e2e-files)
            [[ ${#tests[@]} -gt 0 ]]
          else
            # `desktop-a11y` runs the accessibility audit. Lane sizes by test
            # count; see the strategy comment above.
            export PWRAGENT_E2E_SKIP_A11Y=1
            export PWTEST_SHARD_WEIGHTS="54:68:68:59:84"
            tests=(--shard=${{ matrix.lane }}/5)
          fi
          xvfb-run --auto-servernum \
            --server-args="-screen 0 1920x1080x24 -noreset" \
            bash .github/scripts/run-linux-desktop-e2e.sh \
            "${tests[@]}" \
            --retries=0

      - name: Verify the E2E slice completed
        if: steps.e2e-tests.outcome == 'success'
        run: node scripts/ci/run-retry-failures.mjs e2e-first-verify

      - name: Select failed E2E tests
        id: e2e-selection
        if: steps.e2e-tests.outcome == 'failure'
        run: node scripts/ci/run-retry-failures.mjs e2e-prepare

      - name: Retry failed E2E tests
        id: e2e-retry
        if: steps.e2e-tests.outcome == 'failure'
        continue-on-error: true
        env:
          PWRAGENT_E2E_PREBUILT: "1"
          PWRAGENT_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/e2e-retry.json
          PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: ${{ github.workspace }}/.local/ci/retry/e2e-last.json
        run: >-
          xvfb-run --auto-servernum
          --server-args="-screen 0 1920x1080x24 -noreset"
          bash .github/scripts/run-linux-desktop-e2e.sh
          --last-failed --retries=0 --trace=retain-on-failure

      - name: Check E2E retry results
        if: steps.e2e-tests.outcome == 'failure' && steps.e2e-selection.outcome == 'success'
        env:
          PWRAGENT_RETRY_OUTCOME: ${{ steps.e2e-retry.outcome }}
        run: node scripts/ci/run-retry-failures.mjs e2e-verify

      - name: Record retry slice
        if: ${{ !cancelled() && always() }}
        continue-on-error: true
        uses: ./.github/actions/flake-slice
        with:
          kind: e2e
          platform: linux
          lane: ${{ matrix.lane }}
          sample: 1
          job-status: ${{ job.status }}
          first-outcome: ${{ steps.e2e-tests.outcome }}
          retry-outcome: ${{ steps.e2e-retry.outcome }}

      - name: Upload desktop Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: desktop-e2e-linux-lane-${{ matrix.lane }}-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
            .local/ci/retry/
          include-hidden-files: true
          retention-days: 30

  desktop-a11y:
    name: Linux Desktop a11y (lane ${{ matrix.lane }} of 2)
    runs-on: ubuntu-latest
    needs: [changes, install-deps, pr-test-impact-plan]
    # The accessibility audit (`a11y.spec.ts`) audits every surface in all
    # shipped appearances: about 376s of Linux test time, more than any
    # Desktop E2E lane. It runs here instead of in those lanes, on every
    # push, and on a pull request only when the classifier's `a11y` output
    # is `true` or a narrowed test plan selected the spec. See
    # .github/workflows/README.md#accessibility-audit-on-prs.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code_impacting == 'true'
      && needs.install-deps.result == 'success'
      && (needs.changes.outputs.a11y == 'true' || needs.pr-test-impact-plan.outputs.e2e_a11y == 'true') }}
    strategy:
      # The spec runs in `parallel` mode, so each test is its own shard group
      # and Playwright splits its 63 tests 32/31 by count. Modeled from three
      # main runs: 222s and 154s, 316s and 213s on the slowest runner.
      fail-fast: false
      matrix:
        lane: [1, 2]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"

      - name: Install Linux window manager
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openbox x11-utils

      - name: Run the accessibility audit
        id: e2e-tests
        continue-on-error: true
        timeout-minutes: 10
        env:
          PWRAGENT_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/e2e-first.json
          PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: ${{ github.workspace }}/.local/ci/retry/e2e-last.json
        # Same display setup as the Desktop E2E lanes.
        run: >-
          xvfb-run --auto-servernum
          --server-args="-screen 0 1920x1080x24 -noreset"
          bash .github/scripts/run-linux-desktop-e2e.sh
          e2e/a11y.spec.ts --shard=${{ matrix.lane }}/2
          --retries=0

      - name: Verify the audit slice completed
        if: steps.e2e-tests.outcome == 'success'
        run: node scripts/ci/run-retry-failures.mjs e2e-first-verify

      - name: Select failed audit tests
        id: e2e-selection
        if: steps.e2e-tests.outcome == 'failure'
        run: node scripts/ci/run-retry-failures.mjs e2e-prepare

      - name: Retry failed audit tests
        id: e2e-retry
        if: steps.e2e-tests.outcome == 'failure'
        continue-on-error: true
        env:
          PWRAGENT_E2E_PREBUILT: "1"
          PWRAGENT_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/e2e-retry.json
          PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: ${{ github.workspace }}/.local/ci/retry/e2e-last.json
        run: >-
          xvfb-run --auto-servernum
          --server-args="-screen 0 1920x1080x24 -noreset"
          bash .github/scripts/run-linux-desktop-e2e.sh
          --last-failed --retries=0 --trace=retain-on-failure

      - name: Check audit retry results
        if: steps.e2e-tests.outcome == 'failure' && steps.e2e-selection.outcome == 'success'
        env:
          PWRAGENT_RETRY_OUTCOME: ${{ steps.e2e-retry.outcome }}
        run: node scripts/ci/run-retry-failures.mjs e2e-verify

      - name: Record retry slice
        if: ${{ !cancelled() && always() }}
        continue-on-error: true
        uses: ./.github/actions/flake-slice
        with:
          kind: e2e
          platform: linux-a11y
          lane: ${{ matrix.lane }}
          sample: 1
          job-status: ${{ job.status }}
          first-outcome: ${{ steps.e2e-tests.outcome }}
          retry-outcome: ${{ steps.e2e-retry.outcome }}

      - name: Upload audit Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: desktop-e2e-linux-a11y-lane-${{ matrix.lane }}-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
            .local/ci/retry/
          include-hidden-files: true
          retention-days: 30

  desktop-e2e-result:
    # Preserve the required status-check context while the work runs as
    # independently named matrix jobs across more than one platform.
    # `always()` is required so a failed lane reaches this job and cannot turn
    # the aggregate check into a skip — branch protection counts a skipped
    # required check as satisfied, so without it the gate would stop gating in
    # exactly the case it exists for. Each lane is read from `needs.*.result`
    # in the step below rather than gating entry to the job.
    #
    # `windows-e2e` is deliberately absent. It landed 2026-09-14 as an
    # explicitly advisory lane and is not yet stable enough to gate merges: on
    # the 20 `main` runs after it landed, 7 had at least one Windows lane fail
    # (lane 3 alone failed 6 times), so gating would have reddened roughly one
    # main run in three for reasons unrelated to the change under test.
    #
    # Promote it once #2139 — which fixes the Star Map readiness failures those
    # lanes actually hit — has merged and `main` has held a green Windows
    # baseline. Adding it is then one entry in `needs` plus one `require` call.
    # pwrdrvr/PwrGit and pwrdrvr/PwrSnap already gate their Windows lanes;
    # keep this job's shape identical to theirs so the three cannot drift.
    name: Desktop E2E
    runs-on: ubuntu-latest
    needs: [changes, pr-test-impact-plan, desktop-e2e, desktop-a11y, desktop-e2e-macos]
    if: >-
      always() &&
      needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 5
    steps:
      - name: Require the Linux, accessibility and macOS Desktop E2E lanes
        env:
          E2E_LANES: ${{ needs.pr-test-impact-plan.result == 'success' && needs.pr-test-impact-plan.outputs.e2e_lanes || '' }}
          LINUX_E2E_RESULT: ${{ needs.desktop-e2e.result }}
          A11Y_RESULT: ${{ needs.desktop-a11y.result }}
          # Mirrors the `if:` of desktop-a11y.
          A11Y_REQUESTED: ${{ (needs.changes.outputs.a11y == 'true' || needs.pr-test-impact-plan.outputs.e2e_a11y == 'true') && 'true' || 'false' }}
          MACOS_E2E_RESULT: ${{ needs.desktop-e2e-macos.result }}
          FULL_PLATFORMS: ${{ needs.changes.outputs.full_platforms }}
        run: |
          set -euo pipefail

          # Mirror each line into the job summary so the PR checks page names
          # the platform that broke without anyone opening the job log.
          say() {
            echo "$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          # Report every platform before exiting, so a red gate names the
          # platform that broke instead of stopping at the first check and
          # hiding whether the others were healthy.
          status=0
          require() {
            if [[ "$2" == "success" ]]; then
              say "- PASS \`$1\` ($2)"
            else
              say "- FAIL \`$1\` ($2)"
              echo "::error::$1 Desktop E2E did not succeed ($2)."
              status=1
            fi
          }

          say "### Desktop E2E platform results"
          # The test plan leaves the lane list empty when the pull request
          # affects no spec. Accept that skip only when the plan said so.
          if [[ "${E2E_LANES:-}" == "[]" && "$LINUX_E2E_RESULT" == "skipped" ]]; then
            say "- SKIP \`Linux\` (the test plan found no spec that this change affects)"
          else
            require "Linux" "$LINUX_E2E_RESULT"
          fi
          # Pull requests leave the accessibility audit to `main` unless the
          # classifier or the test plan asked for it.
          if [[ "$A11Y_REQUESTED" == "false" && "$A11Y_RESULT" == "skipped" ]]; then
            say "- SKIP \`Linux a11y\` (runs on \`main\`; add the \`ci:a11y\` label and use **Re-run all jobs** to run it here)"
          else
            require "Linux a11y" "$A11Y_RESULT"
          fi
          # The classifier leaves macOS to `main` on pull requests. Accept a
          # skip only when it said so; any other skip, and every other
          # result, still fails the gate.
          if [[ "$FULL_PLATFORMS" == "false" && "$MACOS_E2E_RESULT" == "skipped" ]]; then
            say "- SKIP \`macOS\` (runs on \`main\`; add the \`ci:full\` label and use **Re-run all jobs** to run it here)"
          else
            require "macOS" "$MACOS_E2E_RESULT"
          fi

          exit "$status"
  macos-install-deps:
    name: Setup macOS Dependencies
    # Free GitHub-hosted Apple Silicon (standard size). Every Mac job uses
    # macos-26: actool 26 compiles build/icon.icon and needs a macOS 26 host.
    # configure-nodejs keys the store on runner.os + runner.arch, so this
    # primes the cache the unit and E2E lanes restore. Do not use
    # macos-26-intel or a paid larger size.
    if: needs.changes.outputs.code_impacting == 'true' && needs.changes.outputs.full_platforms == 'true'
    runs-on: macos-26
    needs: changes
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          sparse-checkout: |
            **/package.json
            .pnpmfile.cjs
            patches/**
            pnpm-lock.yaml
            pnpm-workspace.yaml
            scripts/linux-sandbox.mjs
            apps/desktop/scripts/ensure-electron-runtime.mjs
            apps/desktop/scripts/electron-runtime-cache.mjs
          sparse-checkout-cone-mode: false

      # Only populate the dependency cache on a miss. The parallel consumers
      # restore it after this job (including cache saves) succeeds.
      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"
          lookup-only: "true"

  test-macos:
    name: macOS unit tests (lane ${{ matrix.lane }} of 4)
    runs-on: macos-26
    needs: [changes, macos-install-deps]
    # Exercise the release unit-test platform before a tag is cut. Pull
    # requests run it only when `changes` sets `full_platforms`.
    if: needs.changes.outputs.code_impacting == 'true' && needs.changes.outputs.full_platforms == 'true'
    # Two lanes exhausted this deadline while still running tests. Four keep
    # native-module process isolation and the deadline with less work per VM.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4]
    steps:
      # Nothing on a CI runner searches the index, but a fresh VM runs 14-19
      # Spotlight workers at about 20% CPU for the whole lane, on 3 cores.
      # Turning indexing off halved the median load during the unit run
      # (16-20 to 7) in run 41734854288; peak load and lane time did not
      # change. Nothing in the suite uses Spotlight, so a failure here must
      # not stop the tests.
      - name: Turn off Spotlight indexing
        continue-on-error: true
        timeout-minutes: 2
        run: sudo mdutil -a -i off

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"

      # electron-builder compiles build/icon.icon with actool 26. The macos-26
      # host supplies the matching AssetCatalogAgent runtime; this action
      # verifies the selected Xcode still has actool 26+. Only the test step
      # sets DEVELOPER_DIR, so native setup keeps the image toolchain and SDK.
      - name: Select an Xcode with actool 26
        id: xcode
        uses: ./.github/actions/select-xcode-for-actool

      - name: Test (unit)
        id: unit-tests
        continue-on-error: true
        env:
          # Require the icon compile check wherever Vitest assigns its suite.
          DEVELOPER_DIR: ${{ steps.xcode.outputs.developer-dir }}
          PWRAGENT_REQUIRE_ACTOOL: "1"
          PWRAGENT_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/unit-first.json
          # Test-only phase evidence for the v1.4.12 native relay timeout.
          PWRAGENT_NATIVE_ORACLE_PROFILE: ${{ github.workspace }}/.local/ci/native-relay-profile.jsonl
        run: pnpm test --shard=${{ matrix.lane }}/4 --reporter=default --reporter=json --reporter=./scripts/ci/vitest-ci-reporter.mjs --outputFile=.local/ci/macos-unit-results.json

      - name: Verify the unit slice completed
        id: unit-completion
        if: steps.unit-tests.outcome == 'success'
        run: node scripts/ci/run-retry-failures.mjs unit-verify

      - name: Retry failed unit tests
        id: unit-retry
        if: steps.unit-tests.outcome == 'failure'
        env:
          DEVELOPER_DIR: ${{ steps.xcode.outputs.developer-dir }}
          PWRAGENT_REQUIRE_ACTOOL: "1"
        run: pnpm exec node scripts/ci/run-retry-failures.mjs unit

      - name: Record retry slice
        if: ${{ !cancelled() && always() }}
        continue-on-error: true
        uses: ./.github/actions/flake-slice
        with:
          kind: unit
          platform: macos
          lane: ${{ matrix.lane }}
          sample: 1
          job-status: ${{ job.status }}
          first-outcome: ${{ steps.unit-tests.outcome }}
          retry-outcome: ${{ steps.unit-retry.outcome }}

      - name: Upload unit timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-unit-timings-lane-${{ matrix.lane }}
          path: |
            .local/ci/macos-unit-results.json
            .local/ci/native-relay-profile.jsonl
            .local/ci/retry/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failed unit shutdown probes
        if: steps.unit-tests.outcome == 'failure' || steps.unit-completion.outcome == 'failure' || failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: macos-unit-shutdown-probes-lane-${{ matrix.lane }}
          path: apps/desktop/test-results/unit-shutdown-probes/
          if-no-files-found: ignore
          retention-days: 7

  desktop-e2e-macos:
    name: macOS Desktop E2E (lane ${{ matrix.lane }} of 5)
    # GitHub-hosted, fresh VM per job, so fork PRs run here too. Never move
    # this lane back to self-hosted machines: this is a public repository.
    # Pull requests run it only when `changes` sets `full_platforms`.
    if: needs.changes.outputs.code_impacting == 'true' && needs.changes.outputs.full_platforms == 'true'
    runs-on: macos-26
    needs: [changes, macos-install-deps]
    strategy:
      # The five-lane fit models a 12:14 worst job time using recent main
      # test durations plus the worst observed job overhead.
      # See docs/desktop-e2e-shard-timings.md.
      #
      # Do not cancel the other shards on failure: their artifacts distinguish
      # a product failure from runner trouble.
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4, 5]
    # Keep five extra minutes above the 15-minute timing benchmark so slow
    # runners have time for retries, reporting, and cleanup.
    timeout-minutes: 20
    steps:
      # Indexing competes with dependency extraction and Electron startup on
      # fresh hosted VMs. Stop it before checkout can enqueue more work. The
      # same-run comparison and per-spec timings are recorded in
      # docs/macos-desktop-e2e-timings.md. This optional tuning must not gate
      # tests when a hosted volume is still transitioning its indexing state.
      - name: Disable Spotlight indexing on the hosted VM
        continue-on-error: true
        timeout-minutes: 2
        run: |
          sudo mdutil -a -i off
          mdutil -a -s

      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        # macOS visual baselines are LFS objects.
        with:
          lfs: true

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"

      - name: Run desktop replay-backed Electron tests
        # Hosted macOS runners are VMs with a paravirtual GPU, which can reset
        # under Electron load. The early PWRAGENT_E2E_DISABLE_GPU gate selects
        # software rendering before Electron initializes, while ordinary host
        # E2E keeps GPU coverage. test:e2e builds apps/desktop/out first.
        # The shutdown circuit is macOS-lane-only: two consecutive closes at
        # or above 4s (or requiring force-kill) stop this shard after cleanup.
        id: e2e-tests
        continue-on-error: true
        env:
          PWRAGENT_E2E_DISABLE_GPU: "1"
          PWRAGENT_E2E_SHUTDOWN_CIRCUIT_BREAKER: "1"
          PWTEST_SHARD_WEIGHTS: "69:87:78:87:112"
          PWRAGENT_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/e2e-first.json
          PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: ${{ github.workspace }}/.local/ci/retry/e2e-last.json
        # The wrapper keeps a cancelled step alive until Playwright has closed
        # Electron, and kills Electron's main first if the runner escalates.
        # Without it, the runner's orphan reap killed the renderer under a
        # pending failure screenshot and the main segfaulted; see the script.
        # `exec` makes the wrapper the step process, so it gets the signals.
        run: >-
          exec bash ./scripts/ci/macos-e2e-run-lane.sh
          pnpm --filter @pwragent/desktop test:e2e
          --shard=${{ matrix.lane }}/5
          --retries=0

      - name: Verify the E2E slice completed
        if: steps.e2e-tests.outcome == 'success'
        run: node scripts/ci/run-retry-failures.mjs e2e-first-verify

      - name: Select failed E2E tests
        id: e2e-selection
        if: steps.e2e-tests.outcome == 'failure'
        env:
          PWRAGENT_E2E_SHUTDOWN_CIRCUIT_BREAKER: "1"
        run: node scripts/ci/run-retry-failures.mjs e2e-prepare

      - name: Retry failed E2E tests
        id: e2e-retry
        if: steps.e2e-tests.outcome == 'failure'
        continue-on-error: true
        env:
          PWRAGENT_E2E_DISABLE_GPU: "1"
          PWRAGENT_E2E_SHUTDOWN_CIRCUIT_BREAKER: "1"
          PWRAGENT_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/e2e-retry.json
          PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: ${{ github.workspace }}/.local/ci/retry/e2e-last.json
        run: >-
          exec bash ./scripts/ci/macos-e2e-run-lane.sh
          pnpm --filter @pwragent/desktop exec playwright test -c playwright.config.ts
          --last-failed --retries=0 --trace=retain-on-failure

      - name: Check E2E retry results
        if: steps.e2e-tests.outcome == 'failure' && steps.e2e-selection.outcome == 'success'
        env:
          PWRAGENT_RETRY_OUTCOME: ${{ steps.e2e-retry.outcome }}
        run: node scripts/ci/run-retry-failures.mjs e2e-verify

      - name: Record retry slice
        if: ${{ !cancelled() && always() }}
        continue-on-error: true
        uses: ./.github/actions/flake-slice
        with:
          kind: e2e
          platform: macos
          lane: ${{ matrix.lane }}
          sample: 1
          job-status: ${{ job.status }}
          first-outcome: ${{ steps.e2e-tests.outcome }}
          retry-outcome: ${{ steps.e2e-retry.outcome }}

      - name: Upload macOS Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: desktop-e2e-macos-lane-${{ matrix.lane }}-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
            .local/ci/retry/
          include-hidden-files: true
          retention-days: 30

  windows-e2e:
    name: ${{ contains(github.event.pull_request.labels.*.name, 'ci:windows-shutdown-diagnostics') && format('Windows Desktop E2E (sample {0}, lane {1} of 4)', matrix.sample, matrix.lane) || format('Windows Desktop E2E (lane {0} of 4)', matrix.lane) }}
    # Advisory while the lane establishes a baseline: it is deliberately absent
    # from `desktop-e2e-result`, so a Windows-only failure cannot block a merge
    # yet. Promote it into that aggregate once it has been green for a while.
    #
    # Until this job existed, `e2e/windows-codex-discovery.spec.ts` and
    # `e2e/windows-titlebar-hover.spec.ts` had never executed on any runner:
    # both are ordinary members of the suite that self-skip off win32, and no
    # lane ran Playwright on Windows. The first guards native `.cmd` discovery
    # and launch, which is exactly the Git-for-Windows launcher-handoff class
    # that CLAUDE.md records as expensive.
    #
    # Pull requests run it only when `changes` sets `full_platforms`, or with
    # the shutdown-diagnostics label, which exists to run this job.
    runs-on: windows-latest
    needs: [changes, windows-install-deps]
    if: >-
      needs.changes.outputs.code_impacting == 'true' && (
        needs.changes.outputs.full_platforms == 'true'
        || contains(github.event.pull_request.labels.*.name, 'ci:windows-shutdown-diagnostics')
      )
    strategy:
      # Keep the other lanes running after a failure so their artifacts show
      # whether a failure is isolated or suite-wide, exactly as the Linux and
      # macOS matrices do. Hosted Windows capacity runs all four concurrently,
      # so no max-parallel cap is needed.
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4]
        # Repeated samples and native observation are opt-in investigation work.
        sample: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci:windows-shutdown-diagnostics') && '[1, 2, 3]' || '[1]') }}
    # One budget for setup, build, tests, and reporting. Do not add shorter
    # step or suite deadlines that interrupt a progressing lane before this cap.
    # Green lanes take 6 to 9.75 minutes (15 CI runs, 2026-11-01), and a lane
    # that was still passing tests was cancelled at 10 minutes, so the cap
    # leaves about 5 minutes of headroom.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        # No `lfs: true` here, unlike the Linux and macOS lanes. The only LFS
        # objects in the tree are the two darwin visual baselines, and
        # `visual-regression.spec.ts` skips off darwin/arm64.

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        with:
          node-version: "^24.22.1"
          working-directory: .
          cache-electron: "true"

      - name: Prepare official Windows shutdown diagnostics
        if: contains(github.event.pull_request.labels.*.name, 'ci:windows-shutdown-diagnostics')
        continue-on-error: true
        shell: pwsh
        run: |
          $diagnosticToolDirectory = Join-Path $env:RUNNER_TEMP "pwragent-pipe-handles"
          New-Item -ItemType Directory -Path $diagnosticToolDirectory -Force | Out-Null
          $diagnosticArchive = Join-Path $diagnosticToolDirectory "Handle.zip"
          Invoke-WebRequest "https://download.sysinternals.com/files/Handle.zip" -OutFile $diagnosticArchive
          Expand-Archive -LiteralPath $diagnosticArchive -DestinationPath $diagnosticToolDirectory -Force
          $diagnosticHandlePath = Join-Path $diagnosticToolDirectory "handle64.exe"
          $diagnosticSignature = Get-AuthenticodeSignature -LiteralPath $diagnosticHandlePath
          if ($diagnosticSignature.Status -ne "Valid" -or $diagnosticSignature.SignerCertificate.Subject -notmatch "(^|, )O=Microsoft Corporation(,|$)") {
            throw "Official Handle signature verification failed; diagnostics will be unavailable."
          }
          "PWRAGENT_WINDOWS_HANDLE_EXE=$diagnosticHandlePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Run the debugger from the runner temp volume. CDB's startup loads its
          # engine and extension packages from disk inside a 5 s readiness
          # check, and the OS volume (C:) stalls for minutes at a time.
          $diagnosticDebuggerDirectory = Join-Path $env:RUNNER_TEMP "pwragent-cdb"
          Copy-Item -LiteralPath (Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Debuggers\x64") -Destination $diagnosticDebuggerDirectory -Recurse -Force
          $diagnosticCdbPath = Join-Path $diagnosticDebuggerDirectory "cdb.exe"
          foreach ($diagnosticDebuggerFile in @($diagnosticCdbPath, (Join-Path $diagnosticDebuggerDirectory "dbgeng.dll"))) {
            $diagnosticCdbSignature = Get-AuthenticodeSignature -LiteralPath $diagnosticDebuggerFile
            if ($diagnosticCdbSignature.Status -ne "Valid" -or $diagnosticCdbSignature.SignerCertificate.Subject -notmatch "(^|, )O=Microsoft Corporation(,|$)") {
              throw "Installed CDB signature verification failed; native stacks will be unavailable."
            }
          }
          "PWRAGENT_WINDOWS_CDB_EXE=$diagnosticCdbPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run desktop replay-backed Electron tests
        # windows-latest provides an interactive desktop session, so unlike the
        # Linux lane this needs neither xvfb nor a window manager.
        #
        # Sharding groups by file, except `a11y.spec.ts`, which runs in
        # `parallel` mode. Unlike Linux, these lanes keep the accessibility
        # audit, so the weights are Windows' own: 59:121:104:112, fit to the
        # 396 collected tests from three main runs. Lane 1 holds the first 59
        # a11y tests. See docs/desktop-e2e-shard-timings.md.
        #
        # TEMP and TMP move every fixture root, Electron profile, state
        # database and app-spawned temp file off the OS volume (C:) onto the
        # runner temp volume, beside the checkout. C: stalls disk I/O for
        # minutes at a time; Electron's main process then outlives its quit
        # in CreateFile/FlushFileBuffers and keeps the launcher pipe open.
        # scripts/windows-e2e-temp-volume-workflow.test.mjs holds the evidence.
        id: e2e-tests
        continue-on-error: true
        env:
          PWTEST_SHARD_WEIGHTS: "59:121:104:112"
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          PWRAGENT_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/e2e-first.json
          PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: ${{ github.workspace }}/.local/ci/retry/e2e-last.json
        run: >-
          pnpm ${{ contains(github.event.pull_request.labels.*.name, 'ci:windows-shutdown-diagnostics') && 'test:desktop-e2e:windows-diagnostics' || 'test:desktop-e2e' }}
          --shard=${{ matrix.lane }}/4
          --retries=0

      - name: Verify the E2E slice completed
        if: steps.e2e-tests.outcome == 'success'
        run: node scripts/ci/run-retry-failures.mjs e2e-first-verify

      - name: Select failed E2E tests
        id: e2e-selection
        if: steps.e2e-tests.outcome == 'failure'
        run: node scripts/ci/run-retry-failures.mjs e2e-prepare

      - name: Retry failed E2E tests
        id: e2e-retry
        if: steps.e2e-tests.outcome == 'failure'
        continue-on-error: true
        env:
          PWRAGENT_E2E_PREBUILT: "1"
          PWRAGENT_CI_TEST_REPORT: ${{ github.workspace }}/.local/ci/retry/e2e-retry.json
          PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: ${{ github.workspace }}/.local/ci/retry/e2e-last.json
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >-
          pnpm ${{ contains(github.event.pull_request.labels.*.name, 'ci:windows-shutdown-diagnostics') && 'test:desktop-e2e:windows-diagnostics' || '--filter @pwragent/desktop exec playwright test -c playwright.config.ts' }}
          --last-failed --retries=0 --trace=retain-on-failure

      - name: Check E2E retry results
        if: steps.e2e-tests.outcome == 'failure' && steps.e2e-selection.outcome == 'success'
        env:
          PWRAGENT_RETRY_OUTCOME: ${{ steps.e2e-retry.outcome }}
        run: node scripts/ci/run-retry-failures.mjs e2e-verify

      - name: Record retry slice
        if: ${{ !cancelled() && always() }}
        continue-on-error: true
        uses: ./.github/actions/flake-slice
        with:
          kind: e2e
          platform: windows
          lane: ${{ matrix.lane }}
          sample: ${{ matrix.sample }}
          job-status: ${{ job.status }}
          first-outcome: ${{ steps.e2e-tests.outcome }}
          retry-outcome: ${{ steps.e2e-retry.outcome }}

      - name: Upload desktop Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ contains(github.event.pull_request.labels.*.name, 'ci:windows-shutdown-diagnostics') && format('desktop-e2e-windows-sample-{0}-lane-{1}-artifacts', matrix.sample, matrix.lane) || format('desktop-e2e-windows-lane-{0}-artifacts', matrix.lane) }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
            .local/ci/retry/
          include-hidden-files: true
          retention-days: 30

  flake-report:
    name: Consolidate test retries
    runs-on: ubuntu-latest
    needs: [changes, pr-test-impact-plan, test, test-macos, windows-desktop-main, windows-renderer-packages, desktop-e2e, desktop-a11y, desktop-e2e-macos, windows-e2e]
    if: ${{ always() && !cancelled() && needs.changes.outputs.code_impacting == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download compact slice reports
        uses: actions/download-artifact@v8
        with:
          pattern: flake-slice-${{ github.run_attempt }}-*
          path: .local/ci/flake-slices
      - name: Consolidate reports
        env:
          FLAKE_SAMPLES: ${{ contains(github.event.pull_request.labels.*.name, 'ci:windows-shutdown-diagnostics') && '3' || '1' }}
          FLAKE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_PLATFORMS: ${{ needs.changes.outputs.full_platforms }}
          WINDOWS_DIAGNOSTICS: ${{ contains(github.event.pull_request.labels.*.name, 'ci:windows-shutdown-diagnostics') }}
          A11Y_REQUESTED: ${{ (needs.changes.outputs.a11y == 'true' || needs.pr-test-impact-plan.outputs.e2e_a11y == 'true') && 'true' || 'false' }}
          # The lanes a pull request's test plan ran. A lane it left out is
          # not a missing slice.
          FLAKE_LANES: >-
            ${{ needs.pr-test-impact-plan.result == 'success' && format(
            '{{"unit-linux":{0},"unit-windows-main":{1},"unit-windows-renderer":{2},"e2e-linux":{3}}}',
            needs.pr-test-impact-plan.outputs.unit_linux_lanes,
            needs.pr-test-impact-plan.outputs.unit_windows_main_lanes,
            needs.pr-test-impact-plan.outputs.unit_windows_renderer_lanes,
            needs.pr-test-impact-plan.outputs.e2e_lanes) || '' }}
        # Mirror the `if:` of test-macos, desktop-e2e-macos, windows-e2e and
        # desktop-a11y, so a platform the classifier skipped is not reported
        # as missing.
        run: |
          set -euo pipefail
          not_run=""
          if [[ "$FULL_PLATFORMS" != "true" ]]; then
            not_run="unit-macos,e2e-macos"
            if [[ "$WINDOWS_DIAGNOSTICS" != "true" ]]; then
              not_run+=",e2e-windows"
            fi
          fi
          if [[ "$A11Y_REQUESTED" != "true" ]]; then
            not_run+="${not_run:+,}e2e-linux-a11y"
          fi
          FLAKE_NOT_RUN="$not_run" node scripts/ci/write-flake-report.mjs aggregate
      - name: Upload consolidated report
        uses: actions/upload-artifact@v7
        with:
          name: ci-flake-report-${{ github.run_attempt }}
          path: .local/ci/flake-report/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  pr-test-impact-plan:
    name: Test plan
    # Decides which tests a pull request affects. The unit and Linux Desktop
    # E2E lanes run that plan in place of the full suite; see
    # docs/pr-test-impact.md. The job does not run for a push, for the
    # `ci:full` label or for a platform-specific path, and every lane then
    # runs in full. A failure here has the same effect.
    if: >-
      ${{ github.event_name == 'pull_request' && needs.changes.outputs.code_impacting == 'true'
      && needs.changes.outputs.full_platforms != 'true' }}
    needs: [changes, install-deps]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    outputs:
      unit_mode: ${{ steps.lanes.outputs.unit_mode }}
      e2e_mode: ${{ steps.lanes.outputs.e2e_mode }}
      unit_linux_lanes: ${{ steps.lanes.outputs.unit_linux_lanes }}
      unit_windows_main_lanes: ${{ steps.lanes.outputs.unit_windows_main_lanes }}
      unit_windows_renderer_lanes: ${{ steps.lanes.outputs.unit_windows_renderer_lanes }}
      e2e_lanes: ${{ steps.lanes.outputs.e2e_lanes }}
      # `true` when a narrowed plan selected `a11y.spec.ts`, which the
      # `desktop-a11y` job then runs; the Desktop E2E lane leaves it out.
      e2e_a11y: ${{ steps.lanes.outputs.e2e_a11y }}
    steps:
      - name: Checkout the tested merge revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read PR changed files
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");
            let files = null;
            try {
              files = (await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              })).map(({ filename, previous_filename, status }) => ({ filename, previous_filename, status }));
            } catch {
              core.warning("Could not retrieve the complete PR file list.");
            }
            fs.mkdirSync(".local/ci", { recursive: true });
            fs.writeFileSync(".local/ci/pr-test-impact-files.json", JSON.stringify(files));

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        with:
          node-version: "^24.22.1"

      - name: Plan the affected tests
        run: node scripts/ci/write-pr-test-impact.mjs

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          # "Re-run failed jobs" keeps this job's result, so the lanes of a
          # later attempt read the same artifact for as long as it is kept.
          name: pr-test-impact-plan
          path: .local/ci/pr-test-impact/plan.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

      # After the upload: a lane narrows only when the plan is there to
      # download. If this job fails earlier, the lanes run the full suite.
      - name: Publish the lanes
        id: lanes
        run: cat .local/ci/pr-test-impact/outputs >> "$GITHUB_OUTPUT"
