name: CI

on:
  push:
    branches:
      - main
      - "releases/**"
  pull_request:
    # Do not add `labeled` back here. Dependabot applies labels to dependency
    # PRs, and label-triggered CI creates skipped check suites that can make
    # those PRs appear to have no real status checks. If a label-gated path
    # needs to run, add the label and push a commit or rerun CI.
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  # PRs share one group per PR number, so a new push cancels the run it
  # supersedes instead of leaving three obsolete builds holding runners.
  #
  # Pushes group on the commit SHA, so no two pushes ever share a group. That
  # matters more than it looks: the default queue is `single`, which keeps at
  # most one run pending per group and cancels the pending run a newer one
  # replaces. A branch-name group with cancel-in-progress disabled would
  # therefore drop the middle commit of any three merged in quick succession,
  # which is exactly the history needed to tell which commit broke main.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Keep the pull_request trigger path-unfiltered so the required check jobs
  # exist on every PR. Documentation-only PRs skip those jobs below instead.
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      code_impacting: ${{ steps.classify.outputs.code_impacting }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Classify changed files
        id: classify
        uses: actions/github-script@v9
        with:
          script: |
            const fullCi = (reason) => {
              core.setOutput("code_impacting", "true");
              core.setOutput("docs_only", "false");
              core.notice(`Running full CI: ${reason}`);
            };

            if (context.eventName !== "pull_request") {
              fullCi(`${context.eventName} events are never docs-only`);
              return;
            }

            let files;
            try {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
            } catch (error) {
              fullCi(`changed-file lookup failed (${error.message})`);
              return;
            }

            const reportedCount = context.payload.pull_request.changed_files;
            if (files.length === 0 || files.length !== reportedCount) {
              fullCi(
                `changed-file list was incomplete (received ${files.length} of ${reportedCount})`,
              );
              return;
            }

            const isDocumentationPath = (path) =>
              path.startsWith("docs/") || path.toLowerCase().endsWith(".md");
            const codeImpactingFile = files.find((file) => {
              const paths = [file.filename, file.previous_filename].filter(Boolean);
              return paths.some((path) => !isDocumentationPath(path));
            });
            const docsOnly = codeImpactingFile === undefined;

            core.setOutput("code_impacting", String(!docsOnly));
            core.setOutput("docs_only", String(docsOnly));
            await core.summary
              .addHeading("Changed-file classification")
              .addTable([
                [{data: "Classification", header: true}, {data: "Files", header: true}],
                [docsOnly ? "Documentation only" : "Code impacting", String(files.length)],
              ])
              .addRaw(
                docsOnly
                  ? "Only `docs/**` and Markdown files changed; expensive CI jobs are skipped."
                  : `Full CI runs because \`${codeImpactingFile.filename}\` is not documentation-only.`,
              )
              .write();

  install-deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          sparse-checkout: |
            **/package.json
            .npmrc
            .pnpmfile.cjs
            patches/**
            pnpm-lock.yaml
            pnpm-workspace.yaml
            apps/desktop/scripts/ensure-electron-runtime.mjs
            apps/desktop/scripts/rebuild-native-for-electron.mjs
          sparse-checkout-cone-mode: false

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.18.0
          cache-electron: "true"
          lookup-only: "true"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.18.0
          cache-electron: "true"

      - name: License metadata
        timeout-minutes: 10
        run: pnpm licenses:check

      - name: SQL template safety
        timeout-minutes: 10
        run: pnpm lint:sql

      - name: Codex storage boundary
        timeout-minutes: 10
        run: pnpm lint:codex-storage

      - name: Renderer color literals
        timeout-minutes: 10
        run: pnpm lint:colors

      - name: Electron version policy
        timeout-minutes: 10
        run: pnpm lint:electron-version

      - name: Cache ESLint results
        uses: actions/cache@v6
        timeout-minutes: 10
        with:
          path: .eslintcache-untyped
          key: eslint-untyped-v1-${{ runner.os }}-node24-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            eslint-untyped-v1-${{ runner.os }}-node24-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'eslint.config.mjs') }}-

      - name: ESLint
        timeout-minutes: 10
        run: pnpm lint:eslint

      - name: Type check
        timeout-minutes: 10
        run: pnpm typecheck

      - name: Dependency boundaries
        timeout-minutes: 10
        run: |
          pnpm exec depcruise --config .dependency-cruiser.cjs \
            --output-type json --output-to cruise-result.json \
            packages/ apps/desktop/src/
          pnpm exec depcruise-fmt --exit-code cruise-result.json

      - name: Boundary violation summary
        if: failure()
        timeout-minutes: 10
        run: |
          pnpm exec depcruise-fmt -T markdown cruise-result.json >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.18.0
          cache-electron: "true"

      - name: Build
        timeout-minutes: 10
        run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.18.0
          cache-electron: "true"

      - name: Install ripgrep
        uses: ./.github/actions/install-ripgrep
        timeout-minutes: 5

      - name: Test
        timeout-minutes: 10
        run: pnpm run test

  windows-install-deps:
    name: Setup Windows Dependencies
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          sparse-checkout: |
            **/package.json
            .npmrc
            .pnpmfile.cjs
            patches/**
            pnpm-lock.yaml
            pnpm-workspace.yaml
            apps/desktop/scripts/ensure-electron-runtime.mjs
            apps/desktop/scripts/rebuild-native-for-electron.mjs
          sparse-checkout-cone-mode: false

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.18.0
          working-directory: .
          cache-electron: "true"
          lookup-only: "true"

  windows-verify:
    name: Windows verify
    runs-on: windows-latest
    needs: [changes, windows-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.18.0
          working-directory: .
          cache-electron: "true"

      - name: Type check
        timeout-minutes: 10
        run: pnpm typecheck

      - name: Build
        timeout-minutes: 15
        run: pnpm run build

  windows-desktop-main:
    name: Windows desktop-main
    runs-on: windows-latest
    needs: [changes, windows-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.18.0
          working-directory: .
          cache-electron: "true"

      - name: Test
        timeout-minutes: 20
        run: pnpm exec vitest run --config vitest.workspace.ts --project desktop-main

  windows-renderer-packages:
    name: Windows renderer + packages
    runs-on: windows-latest
    needs: [changes, windows-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.18.0
          working-directory: .
          cache-electron: "true"

      - name: Install ripgrep
        timeout-minutes: 5
        uses: ./.github/actions/install-ripgrep

      - name: Test
        timeout-minutes: 20
        run: >-
          pnpm exec vitest run --config vitest.workspace.ts
          --project desktop-renderer
          --project messaging
          --project shared

  windows-package:
    name: Windows installer (label-gated)
    # Opt-in only: add the `ci:windows-package` label to a PR to validate the
    # Windows NSIS installer build. Off by default — never runs on normal
    # PRs/pushes, so the ~15-minute packaging cost is paid only on demand.
    needs: changes
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:windows-package') }}
    # node-pty's Electron rebuild currently pulls node-gyp 11.x, which does
    # not recognize Visual Studio 2026 on windows-latest/windows-2025.
    # Keep installer packaging on VS 2022 until that toolchain catches up.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@e1bd1cc1494a20f0ee91dae622b0d2523b6fb53c # v1.4.0
        timeout-minutes: 15
        with:
          node-version: 24.18.0
          working-directory: .
          cache-electron: "true"

      - name: Prepare Windows installer signing input
        timeout-minutes: 25
        run: node apps/desktop/scripts/release.mjs --win --prepare-only

      # Exercise the same archive boundary as the protected release job without
      # granting this PR job signing credentials.
      - name: Archive and expand Windows installer signing input
        timeout-minutes: 10
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "windows-installer-pr-input.tgz"
          ./scripts/release/archive-windows-signing-input.ps1 -ArchivePath $archive
          $input = Join-Path $env:RUNNER_TEMP "windows-installer-pr-input"
          New-Item -ItemType Directory -Path $input -Force | Out-Null
          Push-Location $input
          & tar.exe -xzf $archive
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to expand Windows installer signing input (exit code $LASTEXITCODE)."
          }
          Pop-Location

      - name: Package Windows installer from prepared input (unsigned, no publish)
        timeout-minutes: 25
        shell: pwsh
        run: |
          $input = Join-Path $env:RUNNER_TEMP "windows-installer-pr-input"
          Push-Location $input
          node apps/desktop/scripts/release.mjs --win --sign-stage-only --no-publish
          Pop-Location

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: windows-installer-pr
          path: |
            ${{ runner.temp }}/windows-installer-pr-input/apps/desktop/release-stage/dist/*.exe
            ${{ runner.temp }}/windows-installer-pr-input/apps/desktop/release-stage/dist/*.exe.blockmap
            ${{ runner.temp }}/windows-installer-pr-input/apps/desktop/release-stage/dist/SHA256SUMS
          retention-days: 7

  desktop-e2e:
    name: Linux Desktop E2E (lane ${{ matrix.lane }} of 2)
    runs-on: ubuntu-latest
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    strategy:
      # GitHub-hosted Linux capacity can run both halves concurrently. Keep
      # the other shard running after a failure so its artifacts still show
      # whether the failure is isolated or suite-wide.
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [1, 2]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        # macOS visual baselines are LFS objects. The Linux suite currently
        # skips that platform-specific visual spec, but fetching them here
        # keeps checkout behavior ready for future Linux coverage too.
        with:
          lfs: true

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.18.0
          cache-electron: "true"

      - name: Run desktop replay-backed Electron tests
        timeout-minutes: 10
        run: >-
          xvfb-run --auto-servernum
          pnpm --filter @pwragent/desktop test:e2e
          --shard=${{ matrix.lane }}/2

      - name: Upload desktop Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: desktop-e2e-linux-lane-${{ matrix.lane }}-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 30

  desktop-e2e-result:
    # Preserve the required status-check context while the work runs as two
    # independently named matrix jobs. `always()` is required so a failed
    # lane reaches this job and cannot turn the aggregate check into a skip.
    name: Desktop E2E
    runs-on: ubuntu-latest
    needs: [changes, desktop-e2e]
    if: >-
      always() &&
      needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 5
    steps:
      - name: Require both Linux Desktop E2E lanes
        env:
          LINUX_E2E_RESULT: ${{ needs.desktop-e2e.result }}
        run: |
          if [[ "$LINUX_E2E_RESULT" != "success" ]]; then
            echo "Linux Desktop E2E matrix result: $LINUX_E2E_RESULT"
            exit 1
          fi

  macos-install-deps:
    name: Setup macOS Dependencies
    # GitHub-hosted Apple Silicon, matching the self-hosted Tart runners
    # (macOS 26.6.1). Do not use macos-26-intel. configure-nodejs keys the
    # store on runner.os + runner.arch (macOS/ARM64), not the macOS version,
    # so this gate is shared with those E2E lanes and the macos-15
    # signed-release prepare job. Keep the fork guard: a public fork still
    # cannot run the self-hosted E2E consumer, so priming this cache there
    # would only spend hosted macOS minutes.
    if: >-
      needs.changes.outputs.code_impacting == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: macos-26
    needs: changes
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          sparse-checkout: |
            **/package.json
            .npmrc
            .pnpmfile.cjs
            patches/**
            pnpm-lock.yaml
            pnpm-workspace.yaml
            apps/desktop/scripts/ensure-electron-runtime.mjs
            apps/desktop/scripts/rebuild-native-for-electron.mjs
          sparse-checkout-cone-mode: false

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.18.0
          cache-electron: "true"
          lookup-only: "true"

  desktop-e2e-macos:
    name: macOS Desktop E2E (lane ${{ matrix.lane }} of 4)
    # The restricted PwrDrvr organization runner group exposes this label only
    # to PwrAgent and PwrSnap. The host Tart VM runs Electron on its virtual
    # display, so neither CI nor manual test work takes over an operator's Mac.
    #
    # Never relax this fork guard: a public fork must not execute arbitrary
    # code on a self-hosted machine, even when the VM is softnet-isolated.
    if: >-
      needs.changes.outputs.code_impacting == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, pwrdrvr-macos]
    needs: [changes, macos-install-deps]
    strategy:
      # Bound each Playwright process to roughly half the previous number of
      # Electron launches. The persistent 8 GB guest remains healthy under
      # measured memory pressure, but Virtualization.framework kernel clients
      # still accumulate across a long lane; the two-app federation lifecycle
      # previously ran last after 105 launches.
      #
      # Lane concurrency is bounded by the number of runners in the
      # pwrdrvr-macos group rather than by max-parallel: a lane with no free
      # guest waits for one instead of oversubscribing a guest that is already
      # running Electron. Raised from 2 while the lab returns to 3 builders.
      # Lower it again only if a lane has to be pinned to a subset of guests.
      #
      # Do not cancel the other shards on failure: their artifacts distinguish
      # a product failure from guest degradation.
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [1, 2, 3, 4]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          lfs: true

      - name: Materialize Git LFS assets
        # These jobs reuse persistent runner workspaces. A previous checkout
        # can leave an LFS pointer at an unchanged path, and checkout --force
        # does not necessarily rewrite it after fetching the LFS object.
        # Pull explicitly so Playwright always receives PNG bytes rather than
        # the pointer text, even when this runner served another job first.
        timeout-minutes: 5
        run: git lfs pull

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.18.0
          cache-electron: "true"

      - name: Clear leftover Electron state from previous jobs
        # This runner is a persistent Tart guest, not a fresh VM per job, so a
        # previous job's leaked Electron tree and its macOS saved application
        # state both survive into this one. The saved state is the harmful
        # half: after an abnormal exit AppKit puts up a modal "unexpectedly
        # quit while reopening windows" alert before any window exists, which
        # is exactly how this lane times out having run 0 tests. Force-killing
        # an orphan is itself what arms that alert, so the reap and the state
        # clearing ship together. The step always reports what it found (zero
        # included) so the log carries evidence next time. Process matching is
        # scoped to this runner's own workspace: the guest is shared with
        # PwrSnap and with operator work, and neither may become collateral.
        # Windows lanes are GitHub-hosted (fresh VM per job), so they need no
        # equivalent.
        shell: bash
        timeout-minutes: 5
        run: bash ./scripts/ci/macos-e2e-pre-run-cleanup.sh

      - name: Run desktop replay-backed Electron tests
        # Tart's AppleParavirtGPU can reset under Electron load. The early
        # PWRAGENT_E2E_DISABLE_GPU gate selects software rendering before
        # Electron initializes, while ordinary host E2E keeps GPU coverage.
        # The shutdown circuit is macOS-lane-only: two consecutive closes at
        # or above 4s (or requiring force-kill) stop this shard after cleanup.
        timeout-minutes: 20
        env:
          PWRAGENT_E2E_DISABLE_GPU: "1"
          PWRAGENT_E2E_SHUTDOWN_CIRCUIT_BREAKER: "1"
        run: >-
          pnpm --filter @pwragent/desktop test:e2e
          --shard=${{ matrix.lane }}/4

      - name: Upload macOS Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: desktop-e2e-macos-lane-${{ matrix.lane }}-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 30
