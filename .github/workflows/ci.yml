name: CI

on:
  push:
    branches:
      - main
      - "releases/**"
  pull_request:
    # Do not add `labeled` back here. Dependabot applies labels to dependency
    # PRs, and label-triggered CI creates skipped check suites that can make
    # those PRs appear to have no real status checks. If a label-gated path
    # needs to run, add the label and push a commit or rerun CI.
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  # Keep the pull_request trigger path-unfiltered so the required check jobs
  # exist on every PR. Documentation-only PRs skip those jobs below instead.
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      code_impacting: ${{ steps.classify.outputs.code_impacting }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Classify changed files
        id: classify
        uses: actions/github-script@v9
        with:
          script: |
            const fullCi = (reason) => {
              core.setOutput("code_impacting", "true");
              core.setOutput("docs_only", "false");
              core.notice(`Running full CI: ${reason}`);
            };

            if (context.eventName !== "pull_request") {
              fullCi(`${context.eventName} events are never docs-only`);
              return;
            }

            let files;
            try {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
            } catch (error) {
              fullCi(`changed-file lookup failed (${error.message})`);
              return;
            }

            const reportedCount = context.payload.pull_request.changed_files;
            if (files.length === 0 || files.length !== reportedCount) {
              fullCi(
                `changed-file list was incomplete (received ${files.length} of ${reportedCount})`,
              );
              return;
            }

            const isDocumentationPath = (path) =>
              path.startsWith("docs/") || path.toLowerCase().endsWith(".md");
            const codeImpactingFile = files.find((file) => {
              const paths = [file.filename, file.previous_filename].filter(Boolean);
              return paths.some((path) => !isDocumentationPath(path));
            });
            const docsOnly = codeImpactingFile === undefined;

            core.setOutput("code_impacting", String(!docsOnly));
            core.setOutput("docs_only", String(docsOnly));
            await core.summary
              .addHeading("Changed-file classification")
              .addTable([
                [{data: "Classification", header: true}, {data: "Files", header: true}],
                [docsOnly ? "Documentation only" : "Code impacting", String(files.length)],
              ])
              .addRaw(
                docsOnly
                  ? "Only `docs/**` and Markdown files changed; expensive CI jobs are skipped."
                  : `Full CI runs because \`${codeImpactingFile.filename}\` is not documentation-only.`,
              )
              .write();

  install-deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.code_impacting == 'true' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci:live-agent-core'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.x
          lookup-only: "true"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.x

      - name: License metadata
        timeout-minutes: 10
        run: pnpm licenses:check

      - name: SQL template safety
        timeout-minutes: 10
        run: pnpm lint:sql

      - name: Codex storage boundary
        timeout-minutes: 10
        run: pnpm lint:codex-storage

      - name: Renderer color literals
        timeout-minutes: 10
        run: pnpm lint:colors

      - name: Electron version policy
        timeout-minutes: 10
        run: pnpm lint:electron-version

      - name: ESLint
        timeout-minutes: 10
        run: pnpm lint:eslint

      - name: Type check
        timeout-minutes: 10
        run: pnpm typecheck

      - name: Dependency boundaries
        timeout-minutes: 10
        run: |
          pnpm exec depcruise --config .dependency-cruiser.cjs \
            --output-type json --output-to cruise-result.json \
            packages/ apps/desktop/src/ apps/grok-app-server/src/
          pnpm exec depcruise-fmt --exit-code cruise-result.json

      - name: Boundary violation summary
        if: failure()
        timeout-minutes: 10
        run: |
          pnpm exec depcruise-fmt -T markdown cruise-result.json >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.x

      - name: Build
        timeout-minutes: 10
        run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.x

      - name: Install ripgrep
        uses: ./.github/actions/install-ripgrep
        timeout-minutes: 5

      - name: Test
        timeout-minutes: 10
        run: pnpm run test

  windows-install-deps:
    name: Setup Windows Dependencies
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          sparse-checkout: |
            **/package.json
            .npmrc
            .pnpmfile.cjs
            pnpm-lock.yaml
            pnpm-workspace.yaml
            apps/desktop/scripts/ensure-electron-runtime.mjs
            apps/desktop/scripts/rebuild-native-for-electron.mjs
          sparse-checkout-cone-mode: false

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@e19a1a140ed1851a536fcc2cc116e9d3df6b0ce9 # v1.2.0
        timeout-minutes: 10
        with:
          node-version: 24.14.1
          working-directory: .
          lookup-only: "true"

  windows-verify:
    name: Windows verify
    runs-on: windows-latest
    needs: [changes, windows-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@e19a1a140ed1851a536fcc2cc116e9d3df6b0ce9 # v1.2.0
        timeout-minutes: 10
        with:
          node-version: 24.14.1
          working-directory: .

      - name: Type check
        timeout-minutes: 10
        run: pnpm typecheck

      - name: Build
        timeout-minutes: 15
        run: pnpm run build

  windows-desktop-main:
    name: Windows desktop-main
    runs-on: windows-latest
    needs: [changes, windows-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@e19a1a140ed1851a536fcc2cc116e9d3df6b0ce9 # v1.2.0
        timeout-minutes: 10
        with:
          node-version: 24.14.1
          working-directory: .

      - name: Test
        timeout-minutes: 20
        run: pnpm exec vitest run --config vitest.workspace.ts --project desktop-main

  windows-renderer-packages:
    name: Windows renderer + packages
    runs-on: windows-latest
    needs: [changes, windows-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@e19a1a140ed1851a536fcc2cc116e9d3df6b0ce9 # v1.2.0
        timeout-minutes: 10
        with:
          node-version: 24.14.1
          working-directory: .

      - name: Install ripgrep
        timeout-minutes: 5
        uses: ./.github/actions/install-ripgrep

      - name: Test
        timeout-minutes: 20
        run: >-
          pnpm exec vitest run --config vitest.workspace.ts
          --project desktop-renderer
          --project agent-core
          --project grok-app-server
          --project messaging
          --project shared

  windows-package:
    name: Windows installer (label-gated)
    # Opt-in only: add the `ci:windows-package` label to a PR to validate the
    # Windows NSIS installer build. Off by default — never runs on normal
    # PRs/pushes, so the ~15-minute packaging cost is paid only on demand.
    needs: changes
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:windows-package') }}
    # node-pty's Electron rebuild currently pulls node-gyp 11.x, which does
    # not recognize Visual Studio 2026 on windows-latest/windows-2025.
    # Keep installer packaging on VS 2022 until that toolchain catches up.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@e19a1a140ed1851a536fcc2cc116e9d3df6b0ce9 # v1.2.0
        timeout-minutes: 15
        with:
          node-version: 24.14.1
          working-directory: .

      - name: Package Windows installer (unsigned, no publish)
        timeout-minutes: 25
        run: node apps/desktop/scripts/release.mjs --win --no-publish

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: windows-installer-pr
          path: |
            apps/desktop/release-stage/dist/*.exe
            apps/desktop/release-stage/dist/*.exe.blockmap
            apps/desktop/release-stage/dist/SHA256SUMS
          retention-days: 7

  desktop-e2e:
    name: Desktop E2E
    runs-on: ubuntu-latest
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        # macOS visual baselines are LFS objects. The Linux suite currently
        # skips that platform-specific visual spec, but fetching them here
        # keeps checkout behavior ready for future Linux coverage too.
        with:
          lfs: true

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.x

      - name: Run desktop replay-backed Electron tests
        timeout-minutes: 10
        run: xvfb-run --auto-servernum pnpm run test:desktop-e2e

      - name: Upload desktop Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: desktop-e2e-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 30

  macos-install-deps:
    name: Setup macOS Dependencies
    # Keep the same fork guard as the macOS E2E consumer. A public fork must
    # never execute arbitrary code on the self-hosted runner.
    if: >-
      needs.changes.outputs.code_impacting == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, pwrdrvr-macos]
    needs: changes
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.x
          lookup-only: "true"

  desktop-e2e-macos:
    name: macOS Desktop E2E (lane ${{ matrix.lane }} of 2)
    # The restricted PwrDrvr organization runner group exposes this label only
    # to PwrAgent and PwrSnap. The host Tart VM runs Electron on its virtual
    # display, so neither CI nor manual test work takes over an operator's Mac.
    #
    # Never relax this fork guard: a public fork must not execute arbitrary
    # code on a self-hosted machine, even when the VM is softnet-isolated.
    if: >-
      needs.changes.outputs.code_impacting == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, pwrdrvr-macos]
    needs: [changes, macos-install-deps]
    strategy:
      # Keep both lab VMs busy when they are idle, while avoiding a third
      # queued lane when one is already serving another job. Do not cancel the
      # other shard on failure: its artifacts can distinguish a real failure
      # from a flaky one and make the follow-up rerun smaller.
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [1, 2]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          lfs: true

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.x

      - name: Clear leftover Electron state from previous jobs
        # This runner is a persistent Tart guest, not a fresh VM per job, so a
        # previous job's leaked Electron tree and its macOS saved application
        # state both survive into this one. The saved state is the harmful
        # half: after an abnormal exit AppKit puts up a modal "unexpectedly
        # quit while reopening windows" alert before any window exists, which
        # is exactly how this lane times out having run 0 tests. Force-killing
        # an orphan is itself what arms that alert, so the reap and the state
        # clearing ship together. The step always reports what it found (zero
        # included) so the log carries evidence next time. Process matching is
        # scoped to this runner's own workspace: the guest is shared with
        # PwrSnap and with operator work, and neither may become collateral.
        # Windows lanes are GitHub-hosted (fresh VM per job), so they need no
        # equivalent.
        shell: bash
        timeout-minutes: 5
        run: bash ./scripts/ci/macos-e2e-pre-run-cleanup.sh

      - name: Run desktop replay-backed Electron tests
        # Tart's AppleParavirtGPU can reset under Electron load. The early
        # PWRAGENT_E2E_DISABLE_GPU gate selects software rendering before
        # Electron initializes, while ordinary host E2E keeps GPU coverage.
        timeout-minutes: 20
        env:
          PWRAGENT_E2E_DISABLE_GPU: "1"
        run: >-
          pnpm --filter @pwragent/desktop test:e2e
          --shard=${{ matrix.lane }}/2

      - name: Upload macOS Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: desktop-e2e-macos-lane-${{ matrix.lane }}-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 30

  live-agent-core:
    name: Live Agent Core
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.code_impacting == 'true' ||
       contains(github.event.pull_request.labels.*.name, 'ci:live-agent-core'))
    runs-on: ubuntu-latest
    needs: [changes, install-deps]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          fetch-depth: 0

      - name: Detect live agent-core inputs
        id: changes
        shell: bash
        timeout-minutes: 10
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_LIVE_AGENT_CORE: ${{ contains(github.event.pull_request.labels.*.name, 'ci:live-agent-core') }}
        run: |
          set -euo pipefail
          live_agent_core_label="ci:live-agent-core"

          relevant=false
          matched_path=""
          if [[ "$EVENT_NAME" == "pull_request" && "$FORCE_LIVE_AGENT_CORE" == "true" ]]; then
            relevant=true
            matched_path="pull request label present: $live_agent_core_label"
          fi

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

          if [[ "$relevant" == "true" ]]; then
            echo "Live agent-core input changed: $matched_path"
            echo "Live agent-core inputs changed; running live smoke test."
          else
            {
              echo "### Live Agent Core"
              echo
              echo "Skipped live agent-core smoke test because the \`$live_agent_core_label\` PR label is not present."
              echo
              echo "Add \`$live_agent_core_label\` and rerun CI when live provider coverage is needed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Node.js and dependencies
        if: steps.changes.outputs.relevant == 'true'
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.x

      - name: Install ripgrep
        if: steps.changes.outputs.relevant == 'true'
        uses: ./.github/actions/install-ripgrep
        timeout-minutes: 5

      - name: Live agent-core smoke and tool coverage
        if: steps.changes.outputs.relevant == 'true'
        timeout-minutes: 10
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_BASE_URL: https://api.x.ai/v1
          GROK_MODEL: grok-4.20-reasoning
        run: pnpm --filter @pwragent/agent-core test:live
