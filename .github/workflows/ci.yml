name: CI

on:
  push:
    branches:
      - main
      - "releases/**"
  pull_request:
    # Do not add `labeled` back here. Dependabot applies labels to dependency
    # PRs, and label-triggered CI creates skipped check suites that can make
    # those PRs appear to have no real status checks. If a label-gated path
    # needs to run, add the label and push a commit or rerun CI.
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  # Validation-only PR: rerun CI against pwrdrvr/configure-nodejs@v1 after v1 moved to v1.1.1.
  install-deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.x
          lookup-only: "true"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.x

      - name: License metadata
        timeout-minutes: 10
        run: pnpm licenses:check

      - name: SQL template safety
        timeout-minutes: 10
        run: pnpm lint:sql

      - name: Codex storage boundary
        timeout-minutes: 10
        run: pnpm lint:codex-storage

      - name: Renderer color literals
        timeout-minutes: 10
        run: pnpm lint:colors

      - name: Type check
        timeout-minutes: 10
        run: pnpm typecheck

      - name: Dependency boundaries
        timeout-minutes: 10
        run: |
          pnpm exec depcruise --config .dependency-cruiser.cjs \
            --output-type json --output-to cruise-result.json \
            packages/ apps/desktop/src/
          pnpm exec depcruise-fmt --exit-code cruise-result.json

      - name: Boundary violation summary
        if: failure()
        timeout-minutes: 10
        run: |
          pnpm exec depcruise-fmt -T markdown cruise-result.json >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.x

      - name: Build
        timeout-minutes: 10
        run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.x

      - name: Install ripgrep
        uses: ./.github/actions/install-ripgrep
        timeout-minutes: 5

      - name: Test
        timeout-minutes: 10
        run: pnpm run test

  windows:
    name: Windows (build + test)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      # pwrdrvr/configure-nodejs is POSIX-only, so use a Windows-specific
      # setup action that activates the repo-pinned pnpm through Corepack.
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/configure-windows-nodejs
        timeout-minutes: 10

      - name: Install dependencies
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep
        timeout-minutes: 5
        uses: ./.github/actions/install-ripgrep

      - name: Type check
        timeout-minutes: 10
        run: pnpm typecheck

      - name: Build
        timeout-minutes: 15
        run: pnpm run build

      - name: Test
        timeout-minutes: 20
        run: pnpm run test

  windows-package:
    name: Windows installer (label-gated)
    # Opt-in only: add the `ci:windows-package` label to a PR to validate the
    # Windows NSIS installer build. Off by default — never runs on normal
    # PRs/pushes, so the ~15-minute packaging cost is paid only on demand.
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:windows-package') }}
    # node-pty's Electron rebuild currently pulls node-gyp 11.x, which does
    # not recognize Visual Studio 2026 on windows-latest/windows-2025.
    # Keep installer packaging on VS 2022 until that toolchain catches up.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/configure-windows-nodejs
        timeout-minutes: 10

      - name: Install dependencies
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile

      - name: Package Windows installer (unsigned, no publish)
        timeout-minutes: 25
        run: node apps/desktop/scripts/release.mjs --win --no-publish

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: windows-installer-pr
          path: |
            apps/desktop/release-stage/dist/*.exe
            apps/desktop/release-stage/dist/*.exe.blockmap
            apps/desktop/release-stage/dist/SHA256SUMS
          retention-days: 7

  desktop-e2e:
    name: Desktop E2E
    runs-on: ubuntu-latest
    needs: install-deps
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.x

      - name: Run desktop replay-backed Electron tests
        timeout-minutes: 10
        run: xvfb-run --auto-servernum pnpm run test:desktop-e2e

      - name: Upload desktop Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: desktop-e2e-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 30

  live-agent-core:
    name: Live Agent Core
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: install-deps
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          fetch-depth: 0

      - name: Detect live agent-core inputs
        id: changes
        shell: bash
        timeout-minutes: 10
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_LIVE_AGENT_CORE: ${{ contains(github.event.pull_request.labels.*.name, 'ci:live-agent-core') }}
        run: |
          set -euo pipefail
          live_agent_core_label="ci:live-agent-core"

          relevant=false
          matched_path=""
          if [[ "$EVENT_NAME" == "pull_request" && "$FORCE_LIVE_AGENT_CORE" == "true" ]]; then
            relevant=true
            matched_path="pull request label present: $live_agent_core_label"
          fi

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

          if [[ "$relevant" == "true" ]]; then
            echo "Live agent-core input changed: $matched_path"
            echo "Live agent-core inputs changed; running live smoke test."
          else
            {
              echo "### Live Agent Core"
              echo
              echo "Skipped live agent-core smoke test because the \`$live_agent_core_label\` PR label is not present."
              echo
              echo "Add \`$live_agent_core_label\` and rerun CI when live provider coverage is needed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Node.js and dependencies
        if: steps.changes.outputs.relevant == 'true'
        uses: pwrdrvr/configure-nodejs@v1
        timeout-minutes: 10
        with:
          node-version: 24.x

      - name: Install ripgrep
        if: steps.changes.outputs.relevant == 'true'
        uses: ./.github/actions/install-ripgrep
        timeout-minutes: 5

      - name: Live agent-core smoke and tool coverage
        if: steps.changes.outputs.relevant == 'true'
        timeout-minutes: 10
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_BASE_URL: https://api.x.ai/v1
          GROK_MODEL: grok-4.20-reasoning
        run: pnpm --filter @pwragent/agent-core test:live
