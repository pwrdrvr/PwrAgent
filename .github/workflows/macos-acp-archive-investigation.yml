name: macOS ACP archive investigation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  reproduce:
    if: github.head_ref == 'fix/acp-archive-cleanup-race'
    name: ACP archive repetition (sample ${{ matrix.sample }})
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4]
    steps:
      - name: Disable Spotlight indexing on the hosted VM
        run: sudo mdutil -a -i off

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        with:
          node-version: "^24.22.1"
          cache-electron: "true"

      - name: Run archive worktree specs repeatedly
        env:
          PWRAGENT_E2E_DISABLE_GPU: "1"
          PWRAGENT_E2E_SHUTDOWN_CIRCUIT_BREAKER: "1"
        run: >-
          exec bash ./scripts/ci/macos-e2e-run-lane.sh
          pnpm --filter @pwragent/desktop test:e2e
          e2e/thread-archive-worktree-cleanup.spec.ts --repeat-each=10

      - name: Upload archive diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: acp-archive-repetition-${{ matrix.sample }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 7
