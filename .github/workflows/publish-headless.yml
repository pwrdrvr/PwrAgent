name: Headless CLI package

on:
  pull_request:
    paths:
      - "packages/pwragent/**"
      - "packages/federation/**"
      - "packages/shared/**"
      - "packages/agent-tools/**"
      - "apps/desktop/package.json"
      - "scripts/prepare-release-version.mjs"
      - ".github/workflows/release.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".pnpmfile.cjs"
      - ".github/workflows/publish-headless.yml"
  push:
    branches: [main]
    paths:
      - "packages/pwragent/**"
      - "packages/federation/**"
      - "packages/shared/**"
      - "packages/agent-tools/**"
      - "apps/desktop/package.json"
      - "scripts/prepare-release-version.mjs"
      - ".github/workflows/release.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".pnpmfile.cjs"
      - ".github/workflows/publish-headless.yml"

permissions:
  contents: read
  id-token: none

concurrency:
  group: headless-validation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Publication belongs exclusively to release.yml and its protected desktop tag.
jobs:
  validate:
    name: Headless package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install pinned pnpm
        run: corepack enable
      - name: Install CLI build dependencies
        run: pnpm --filter pwragent... install --frozen-lockfile --ignore-scripts
      - name: Mocked CLI and release guard tests
        run: pnpm --filter pwragent test
      - name: Pack, validate and smoke-test a clean offline installation
        env:
          TMPDIR: ${{ runner.temp }}/headless-package-long-temp-path-for-socket-regression
        run: |
          mkdir -p "$TMPDIR"
          node packages/pwragent/scripts/pack-check.mjs .local/headless-package
