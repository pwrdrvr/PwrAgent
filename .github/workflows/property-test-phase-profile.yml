name: Verify property test performance changes

on:
  push:
    branches: [codex/property-test-profile]

permissions:
  contents: read

jobs:
  profile:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Turn off Spotlight indexing
        continue-on-error: true
        run: sudo mdutil -a -i off
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f
        with:
          node-version: "^24.22.1"
          cache-electron: "true"
      - name: Check exact test diff
        run: |
          pnpm lint:boundaries
          pnpm lint:oxlint
          pnpm lint:oxlint:typed
          pnpm typecheck
      - name: Run focused tests with default randomized seeds
        if: '!cancelled()'
        run: |
          mkdir -p .local/property-profile
          pnpm test single-visible-tooltip.property.test.tsx LinkedProjectsPanel.property.test.tsx \
            thread-search-ranked.property.test.ts LinkedProjectsPanel.test.tsx \
            thread-search-store.test.ts thread-search-query-budget.test.ts \
            data-tooltip-content.property.test.tsx \
            --reporter=default --reporter=json --outputFile=.local/property-profile/final.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: property-test-verification
          path: .local/property-profile/
          include-hidden-files: true
