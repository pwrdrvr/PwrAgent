name: Preview Build (macOS universal)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  preview:
    name: Build preview DMG
    # Never execute public-fork code on the restricted self-hosted group.
    if: >-
      github.event.label.name == 'ci:build-preview' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # The existing restricted runners supply macOS 26 and Xcode 26.
    runs-on: [self-hosted, macOS, ARM64, pwrdrvr-macos]
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7

      - name: Locate the guest cache root
        shell: bash
        run: echo "PWRAGENT_CI_CACHE_ROOT=$HOME/Library/Caches/pwragent-ci" >> "$GITHUB_ENV"

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        with:
          node-version: "^24.22.1"
          cache-electron: "true"
          persistent-store-dir: ${{ env.PWRAGENT_CI_CACHE_ROOT }}

      - name: Compute preview version
        id: version
        run: |
          raw=$(node -p "require('./apps/desktop/package.json').version")
          base=$(echo "$raw" | sed 's/-.*//')
          preview="${base}-pr.${{ github.event.pull_request.number }}"
          echo "version=${preview}" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${preview}"

      - name: Set preview version in package.json
        run: |
          cd apps/desktop
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # electron-builder compiles build/icon.icon with actool 26. The macOS 26
      # guest provides its matching AssetCatalogAgent runtime. Unlike release.yml
      # this single step also runs build:native, so a preview's helpers compile
      # with the selected Xcode as well. See AGENTS.md "macOS app icon".
      - name: Select an Xcode with actool 26
        id: xcode
        uses: ./.github/actions/select-xcode-for-actool

      - name: Build preview package (ad-hoc signed)
        env:
          DEVELOPER_DIR: ${{ steps.xcode.outputs.developer-dir }}
        run: pnpm --filter @pwragent/desktop package:dryrun

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: PwrAgent-${{ steps.version.outputs.version }}-preview
          path: apps/desktop/release-stage/dist/*.dmg
          retention-days: 14

      - name: Upload exact-build preview debug artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: PwrAgent-${{ steps.version.outputs.version }}-preview-debug
          path: |
            apps/desktop/.local/debug-artifacts/*-darwin-universal-debug.tar.gz
            apps/desktop/.local/debug-artifacts/*-darwin-universal-debug.tar.gz.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
