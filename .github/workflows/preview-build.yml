name: Preview Build (macOS universal)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  preview:
    name: Build preview DMG
    if: github.event.label.name == 'ci:build-preview'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: 24.18.0
          cache-electron: "true"

      - name: Compute preview version
        id: version
        run: |
          raw=$(node -p "require('./apps/desktop/package.json').version")
          base=$(echo "$raw" | sed 's/-.*//')
          preview="${base}-pr.${{ github.event.pull_request.number }}"
          echo "version=${preview}" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${preview}"

      - name: Set preview version in package.json
        run: |
          cd apps/desktop
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # electron-builder compiles build/icon.icon with actool, which needs
      # Xcode 26; the image defaults to 16.4. Unlike release.yml this single
      # step also runs build:native, so a preview's helpers compile with the
      # selected Xcode as well. See AGENTS.md "macOS app icon".
      - name: Select an Xcode with actool 26
        id: xcode
        uses: ./.github/actions/select-xcode-for-actool

      - name: Build preview package (unsigned)
        env:
          DEVELOPER_DIR: ${{ steps.xcode.outputs.developer-dir }}
        run: pnpm --filter @pwragent/desktop package:dryrun

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: PwrAgent-${{ steps.version.outputs.version }}-preview
          path: apps/desktop/release-stage/dist/*.dmg
          retention-days: 14
