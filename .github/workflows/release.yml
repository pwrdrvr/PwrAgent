name: Release Desktop (macOS universal + Windows + Linux DEB)

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*" # pre-release tags like v1.0.0-alpha.0
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0-alpha.1). Must already exist on the repo."
        required: true
        type: string

permissions:
  contents: read
  id-token: none

jobs:
  prepare:
    name: Test and prepare signing input
    runs-on: macos-15 # Apple Silicon GH-hosted runner; matches Phase A signing identity
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: none
    outputs:
      signing-input-sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@e1bd1cc1494a20f0ee91dae622b0d2523b6fb53c # v1.4.0
        with:
          node-version: 24.18.0
          cache-electron: "true"

      - name: Check release metadata
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: pnpm release:check

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck

      - name: Test (unit)
        run: pnpm test

      - name: Stage pinned Grok ACP runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/stage-grok-bundle.mjs --platform macos-universal

      - name: Prepare release stage
        env:
          PWRAGENT_REQUIRE_GROK_BUNDLE: "1"
        run: node apps/desktop/scripts/release.mjs --prepare-only

      - name: Archive signing input
        id: archive
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/desktop-release-signing-input.tgz"
          tar -czf "$tarball" \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            apps/desktop/release-stage \
            apps/desktop/scripts/release.mjs \
            apps/desktop/scripts/verify-asar-contents.mjs \
            apps/desktop/scripts/asar-entry-paths.mjs \
            apps/desktop/node_modules \
            node_modules
          sha256="$(shasum -a 256 "$tarball" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          printf "%s  desktop-release-signing-input.tgz\n" "$sha256" > "$RUNNER_TEMP/desktop-release-signing-input.tgz.sha256"

      - name: Upload signing input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-signing-input
          path: |
            ${{ runner.temp }}/desktop-release-signing-input.tgz
            ${{ runner.temp }}/desktop-release-signing-input.tgz.sha256
          retention-days: 7

  sign:
    name: Sign, notarize, package macOS
    runs-on: macos-15
    needs: prepare
    timeout-minutes: 60
    environment: apple-signing
    permissions:
      contents: read
      id-token: none
    steps:
      - name: Download signing input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-release-signing-input
          path: .release-input

      - name: Verify signing input
        env:
          EXPECTED_SHA256: ${{ needs.prepare.outputs.signing-input-sha256 }}
        run: |
          set -euo pipefail
          cd .release-input
          actual="$(shasum -a 256 desktop-release-signing-input.tgz | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          shasum -a 256 --check desktop-release-signing-input.tgz.sha256

      - name: Expand signing input
        run: tar -xzf .release-input/desktop-release-signing-input.tgz

      - name: Sign, notarize, package macOS
        env:
          # Code signing (Developer ID Application: PwrDrvr LLC, T44CNHC4UH).
          # Store these in the apple-signing GitHub Environment, not as repo secrets.
          # CSC_LINK is the .p12 base64-encoded; CSC_KEY_PASSWORD is its password.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

          # Notarization via App Store Connect API key.
          # APPLE_API_KEY_BASE64 is the .p8 file base64-encoded; release.mjs
          # decodes it to a temp file before invoking electron-builder.
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: T44CNHC4UH

          PWRAGENT_REQUIRE_GROK_BUNDLE: "1"
        run: node apps/desktop/scripts/release.mjs --sign-stage-only --no-publish

      - name: Prepare stable-name DMG alias
        run: |
          set -euo pipefail
          cd apps/desktop/release-stage/dist
          versioned=$(ls PwrAgent-*-universal.dmg | head -n 1)
          cp "$versioned" PwrAgent.dmg

      # This is the macOS release payload consumed by publish-release-assets.
      # It is intentionally not a best-effort debug upload: publishing must
      # wait until every signed platform payload is available.
      - name: Upload macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-artifacts
          path: |
            apps/desktop/release-stage/dist/*.dmg
            apps/desktop/release-stage/dist/*.zip
            apps/desktop/release-stage/dist/*.blockmap
            apps/desktop/release-stage/dist/latest-mac.yml
            apps/desktop/release-stage/dist/builder-debug.yml
          retention-days: 30

  linux-package:
    name: Package Linux DEB (${{ matrix.deb_arch }})
    runs-on: ${{ matrix.runner }}
    needs: prepare
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: none
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            builder_arch: x64
            grok_platform: linux-x86_64
            runner: ubuntu-24.04
          - deb_arch: arm64
            builder_arch: arm64
            grok_platform: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@e1bd1cc1494a20f0ee91dae622b0d2523b6fb53c # v1.4.0
        with:
          node-version: 24.18.0
          cache-electron: "true"

      - name: Check release metadata
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: pnpm release:check

      - name: Stage pinned Grok ACP runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/stage-grok-bundle.mjs --platform ${{ matrix.grok_platform }}

      - name: Package Linux DEB
        env:
          PWRAGENT_LINUX_ARCH: ${{ matrix.builder_arch }}
          PWRAGENT_REQUIRE_GROK_BUNDLE: "1"
        run: node apps/desktop/scripts/release.mjs --linux --no-publish

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-deb-${{ matrix.deb_arch }}
          path: apps/desktop/release-stage/dist/*.deb
          retention-days: 7

  windows-prepare:
    name: Prepare Windows signing input
    # node-pty's Electron rebuild currently pulls node-gyp 11.x, which does
    # not recognize Visual Studio 2026 on windows-latest/windows-2025.
    # Keep installer packaging on VS 2022 until that toolchain catches up.
    runs-on: windows-2022
    needs: prepare
    timeout-minutes: 45
    outputs:
      signing-input-sha256: ${{ steps.archive.outputs.sha256 }}
    permissions:
      contents: read
      id-token: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@e1bd1cc1494a20f0ee91dae622b0d2523b6fb53c # v1.4.0
        with:
          node-version: 24.18.0
          working-directory: .
          cache-electron: "true"

      - name: Stage pinned Grok ACP runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/stage-grok-bundle.mjs --platform windows-x86_64

      - name: Prepare Windows release stage
        env:
          PWRAGENT_REQUIRE_GROK_BUNDLE: "1"
        run: node apps/desktop/scripts/release.mjs --win --prepare-only

      - name: Archive Windows signing input
        id: archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "windows-release-signing-input.tgz"
          ./scripts/release/archive-windows-signing-input.ps1 -ArchivePath $archive
          $sha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "$sha256  windows-release-signing-input.tgz" |
            Set-Content -Path "$archive.sha256" -Encoding ascii

      - name: Upload Windows signing input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release-signing-input
          path: |
            ${{ runner.temp }}/windows-release-signing-input.tgz
            ${{ runner.temp }}/windows-release-signing-input.tgz.sha256
          retention-days: 7

  windows-sign:
    name: Sign and package Windows installer
    # Only this job can access the Azure service-principal credentials. It does
    # not check out source or install project dependencies/lifecycle scripts.
    environment: windows-signing
    runs-on: windows-2022
    needs: windows-prepare
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: none
    steps:
      - name: Download Windows signing input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-signing-input
          path: .release-input

      - name: Verify Windows signing input
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.windows-prepare.outputs.signing-input-sha256 }}
        run: |
          $archive = ".release-input/windows-release-signing-input.tgz"
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) {
            throw "Windows signing input digest mismatch: expected $env:EXPECTED_SHA256, got $actual."
          }
          $recorded = (Get-Content "$archive.sha256" -Raw).Trim()
          if ($recorded -ne "$actual  windows-release-signing-input.tgz") {
            throw "Windows signing input checksum file does not match the downloaded archive."
          }

      - name: Expand Windows signing input
        shell: pwsh
        run: |
          & tar.exe -xzf .release-input/windows-release-signing-input.tgz
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to expand Windows signing input (exit code $LASTEXITCODE)."
          }

      - name: Install TrustedSigning
        shell: pwsh -NoProfile -NonInteractive -File {0}
        run: ./scripts/release/install-trusted-signing.ps1

      # The credentials are injected only for the signing-aware packaging step.
      # electron-builder signs the app executables, generated uninstaller, and
      # final NSIS installer, so this step must package as well as sign.
      - name: Sign and package Windows installer
        env:
          WIN_AZURE_SIGN_PUBLISHER_NAME: ${{ vars.WIN_AZURE_SIGN_PUBLISHER_NAME }}
          WIN_AZURE_SIGN_ENDPOINT: ${{ vars.WIN_AZURE_SIGN_ENDPOINT }}
          WIN_AZURE_SIGN_ACCOUNT: ${{ vars.WIN_AZURE_SIGN_ACCOUNT }}
          WIN_AZURE_SIGN_PROFILE: ${{ vars.WIN_AZURE_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          PWRAGENT_REQUIRE_GROK_BUNDLE: "1"
        run: >-
          node apps/desktop/scripts/release.mjs
          --win --sign-stage-only --no-publish --require-signing

      # `/releases/latest/download/<name>` only resolves for a version-independent
      # asset name. macOS publishes `PwrAgent.dmg` and Linux publishes
      # `PwrAgent-linux-<arch>.deb`; this is the Windows equivalent. The copy has
      # to happen after the packaging step above so the alias carries the same
      # Authenticode signature as the installer it copies.
      - name: Prepare stable-name Windows installer alias
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "apps/desktop/release-stage/dist"
          $versioned = Get-ChildItem -Path $dist -File -Filter "PwrAgent-*-windows-x64-setup.exe" |
            Sort-Object -Property Name |
            Select-Object -First 1
          if (-not $versioned) {
            throw "No versioned Windows installer found under $dist."
          }
          $aliasName = "PwrAgent-windows-x64-setup.exe"
          $aliasPath = Join-Path $dist $aliasName
          Copy-Item -LiteralPath $versioned.FullName -Destination $aliasPath -Force
          # release.mjs wrote SHA256SUMS before this copy existed. Append the alias
          # so the manifest names every published installer, the way the Linux
          # manifest covers both the versioned package and its stable-name alias.
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $aliasPath).Hash.ToLowerInvariant()
          $manifest = Join-Path $dist "SHA256SUMS"
          Add-Content -LiteralPath $manifest -Value "$digest  $aliasName`n" -NoNewline -Encoding ascii
          Write-Host "alias: $aliasPath"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer
          path: |
            apps/desktop/release-stage/dist/*.exe
            apps/desktop/release-stage/dist/*.exe.blockmap
            apps/desktop/release-stage/dist/SHA256SUMS
          retention-days: 7

  publish-release-assets:
    name: Publish release assets
    runs-on: ubuntu-24.04
    needs:
      - linux-package
      - sign
      - windows-sign
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Download macOS release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-release-artifacts
          path: mac-dist

      - name: Download Windows installer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer
          path: windows-dist

      - name: Download Linux package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-deb-*
          path: linux-dist
          merge-multiple: true

      - name: Generate Linux checksums
        run: |
          set -euo pipefail
          cd linux-dist
          mapfile -t debs < <(find . -maxdepth 1 -type f -name '*.deb' -printf '%f\n' | sort)
          test "${#debs[@]}" -eq 4
          sha256sum "${debs[@]}" > SHA256SUMS

      # The Windows package stage also writes SHA256SUMS. Keep the stable Linux
      # alias for its documented download URL while giving the Windows manifest
      # a platform-specific asset name; GitHub Releases rejects duplicate names.
      - name: Name Windows checksum manifest
        run: mv windows-dist/SHA256SUMS windows-dist/PwrAgent-windows-SHA256SUMS

      - name: Create release and publish all platform assets
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT || github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${RELEASE_TAG:?}"
          notes="$RUNNER_TEMP/RELEASE_NOTES.md"

          node scripts/extract-release-notes.mjs \
            --tag "$RELEASE_TAG" \
            --out "$notes"

          if [ ! -s "$notes" ]; then
            echo "::error::No CHANGELOG.md notes found for $RELEASE_TAG" >&2
            exit 1
          fi

          # Every CI-published release is born as a GitHub Pre-release, even when
          # the tag has no prerelease suffix. Promotion to Latest is a separate
          # operator action after assets, updater metadata, and smoke checks pass.
          release_args=(
            "$RELEASE_TAG"
            --repo pwrdrvr/PwrAgent
            --verify-tag
            --prerelease
            --title "$RELEASE_TAG"
            --notes-file "$notes"
          )

          gh release create "${release_args[@]}" \
            mac-dist/* \
            windows-dist/* \
            linux-dist/*.deb \
            linux-dist/SHA256SUMS

          is_prerelease="$(gh release view "$RELEASE_TAG" \
            --repo pwrdrvr/PwrAgent \
            --json isPrerelease \
            --jq '.isPrerelease')"
          if [ "$is_prerelease" != "true" ]; then
            echo "::error::Release $RELEASE_TAG was not created as a GitHub Pre-release." >&2
            exit 1
          fi

      - name: Upload assembled release artifacts (debug retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: release-publish-artifacts
          path: |
            mac-dist/*
            windows-dist/*
            linux-dist/*.deb
            linux-dist/SHA256SUMS
          retention-days: 30

  publish-release-notes:
    name: Publish release notes
    runs-on: ubuntu-24.04
    needs:
      - publish-release-assets
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Publish changelog notes to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT || github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${RELEASE_TAG:?}"
          VERSION="${RELEASE_TAG#v}"
          notes="$RUNNER_TEMP/RELEASE_NOTES.md"

          node scripts/extract-release-notes.mjs \
            --tag "$RELEASE_TAG" \
            --out "$notes"

          if [ ! -s "$notes" ]; then
            echo "::error::No CHANGELOG.md notes found for $RELEASE_TAG ($VERSION)" >&2
            exit 1
          fi

          gh release edit "$RELEASE_TAG" \
            --repo pwrdrvr/PwrAgent \
            --notes-file "$notes"

          body_length="$(gh release view "$RELEASE_TAG" --repo pwrdrvr/PwrAgent --json body --jq '.body | length')"
          if [ "$body_length" -le 0 ]; then
            echo "::error::Release $RELEASE_TAG still has an empty body" >&2
            exit 1
          fi
