name: macOS E2E verification 2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ci/macos-e2e-duration'
    name: macOS Desktop E2E (lane ${{ matrix.lane }} of 4)
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4]
    steps:
      - name: Disable Spotlight indexing on the hosted VM
        run: |
          sudo mdutil -a -i off
          mdutil -a -s

      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          lfs: true

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@9bb6e786801cf822d57b2298e02ccefd05e8ef0f # v1.7.0
        timeout-minutes: 10
        with:
          node-version: "^24.22.1"
          cache-electron: "true"

      - name: Run desktop replay-backed Electron tests
        env:
          PWRAGENT_E2E_DISABLE_GPU: "1"
          PWRAGENT_E2E_SHUTDOWN_CIRCUIT_BREAKER: "1"
          PWTEST_SHARD_WEIGHTS: "9:12:12:14"
        run: >-
          exec bash ./scripts/ci/macos-e2e-run-lane.sh
          pnpm --filter @pwragent/desktop test:e2e
          --shard=${{ matrix.lane }}/4

      - name: Upload macOS Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: verification-2-macos-lane-${{ matrix.lane }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 7
