version: 2

updates:
  # pnpm workspace. Dependabot uses the npm ecosystem value for pnpm.
  #
  # Monorepo grouping strategy (why this shape exists):
  # - Keep a single `directory: "/"` so version updates own the root
  #   pnpm-lock.yaml and can rewrite every workspace package.json that
  #   declares the dependency. Listing nested package paths as separate
  #   `directories` tends to open package.json-only PRs without a lockfile
  #   update (see PR #1337: `... in /apps/desktop`).
  # - Official cross-directory `groups.*.group-by: dependency-name` only
  #   applies when multiple `directories` are listed, and only for version
  #   updates. We deliberately do not switch this monorepo to multi-directory
  #   just to enable that key: with pnpm + one lockfile, root-owned updates
  #   already collapse the same library across workspace packages into one
  #   version-update PR.
  # - Security updates are a separate pipeline. They ignore version-update
  #   groups unless `applies-to: security-updates` is set, and they key off
  #   alert manifest paths (`apps/desktop/package.json` vs `pnpm-lock.yaml`).
  #   That is how the same library can still open two PRs (PRs #1337 + #1338
  #   for pdfjs-dist). The `npm-security` group below groups security updates
  #   for this npm entry so one library does not fan out per alert/manifest.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels: []
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    # @types/node tracks the Node runtime, which is pinned to v24
    # (.nvmrc + CI node-version: 24.x). Block major bumps so v25+ types
    # don't sneak ahead of the runtime via a grouped dev-dep PR.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Electron majors need a planned desktop runtime migration. Native module
      # prebuild availability, packaging behavior, and Electron breaking changes
      # need human review before a PR is worth opening.
      - dependency-name: "electron"
        update-types:
          - "version-update:semver-major"
      # Vite 8 showed that desktop build-tool majors need coordinated migration
      # across Vite, plugin-react, and electron-vite. Keep routine minor/patch
      # Dependabot PRs flowing, but do not open normal version-update PRs for
      # these majors until we deliberately plan and validate the migration.
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "electron-vite"
        update-types:
          - "version-update:semver-major"
      # Desktop packaging/runtime-adjacent majors also need release-pipeline
      # validation instead of routine Dependabot review.
      - dependency-name: "electron-builder"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@electron/*"
        update-types:
          - "version-update:semver-major"
      # node-fetch is kept at v2 for grammY's current Node runtime shim. The
      # latest grammY release still depends on node-fetch v2 and its CommonJS
      # entrypoint; v3 is ESM-only and should be handled as a planned Telegram
      # runtime change rather than an automated dependency bump.
      - dependency-name: "node-fetch"
        update-types:
          - "version-update:semver-major"
    groups:
      # Security updates ignore the version-update groups below unless this
      # applies-to is set. Group them so the same library does not open one PR
      # per security alert / manifest path (package.json vs lockfile) in the
      # monorepo — the failure mode behind PRs #1337 and #1338 for pdfjs-dist.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      agent-kit:
        patterns:
          - "@pwrdrvr/agent-*"
          - "@pwrdrvr/codex-*"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # The core and provider majors share one LanguageModel protocol version.
      # Updating either package alone can pass installation but fail at runtime.
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/xai"
        dependency-type: "production"
        update-types:
          - "major"
          - "minor"
          - "patch"
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
          - "electron-vite"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      desktop-runtime-minor-patch:
        patterns:
          - "electron"
          - "@electron/*"
          - "better-sqlite3"
          - "electron-builder"
          - "electron-log"
          - "electron-updater"
          - "@types/better-sqlite3"
        update-types:
          - "minor"
          - "patch"
      tiptap-prosemirror:
        patterns:
          - "@tiptap/*"
          - "prosemirror-*"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # Catch-all version-update groups: batch unrelated production/dev
      # minor+patch bumps into summary PRs so the monorepo does not open one
      # PR per package. Special-cased groups above still win for their patterns.
      npm-production-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@pwrdrvr/agent-*"
          - "@pwrdrvr/codex-*"
          - "ai"
          - "@ai-sdk/xai"
          - "@tiptap/*"
          - "prosemirror-*"
          - "better-sqlite3"
          - "electron-log"
          - "electron-updater"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-development-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "vite"
          - "@vitejs/plugin-react"
          - "electron-vite"
          - "electron"
          - "@electron/*"
          - "@types/better-sqlite3"
          - "electron-builder"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels: []
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    # We pin actions to major-version tags (e.g. `@v1`). Those tags silently
    # absorb every minor and patch release upstream, so Dependabot PRs that
    # rewrite `@v1` to `@v1.0.1` are pure noise. Only surface major bumps,
    # which actually warrant a human review.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

# docs-site dependabot entries (bundler + docker for /docs-site)
# moved to pwrdrvr/docs.pwragent.ai when the docs split out of this
# repo on 2026-05-25. Add new entries to that repo's dependabot.yml.
