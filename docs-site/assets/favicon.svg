<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    PwrAgent favicon — the four-bar "transcript" mark from the desktop
    app icon, stripped of the dark rounded-square frame so there's no
    rectangular reference for tab chrome to read as a "box."

    Brightness gradient sits within the tangerine family from
    #ff8a1f (top, full accent) down to #6b3a14 (bottom, deep copper).
    All four bars stay visible against both light and dark tab
    backgrounds. The dim bars don't compete with the bright top bar
    for attention at 16-32 px favicon size.
  -->
  <rect x="100" y="140" width="280" height="55" rx="14" fill="#ff8a1f"/>
  <rect x="100" y="218" width="320" height="55" rx="14" fill="#c4671d"/>
  <rect x="100" y="296" width="220" height="55" rx="14" fill="#8a4818"/>
  <rect x="100" y="374" width="290" height="55" rx="14" fill="#6b3a14"/>
</svg>
